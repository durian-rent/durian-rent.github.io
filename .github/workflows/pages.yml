name: Deploy Pages

on:
  workflow_dispatch:

  schedule:
    - cron: '17 */2 * * *'

  push:
    branches:
      - main
    paths:
     - 'index.html'
     - 'durian.rent.js'
     - 'durian.rent.wasm'
     - 'danang.pmtiles'
     - 'robots.txt'
     - 'sitemap.xml'

  workflow_run:
    workflows:
      - Build bundle
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Refresh KEY
        continue-on-error: ${{ github.event_name != 'schedule' }}
        env:
          GEN_KEY: ${{ secrets.GEN_KEY }}
        run: |
          trap 'rm -f gen_key.cjs' EXIT
          old=$(grep -oP "const KEY = '\K[0-9a-f]{64}" index.html)
          node -e "require('fs').writeFileSync('gen_key.cjs', process.env.GEN_KEY)"
          node gen_key.cjs
          key=$(grep -oP "const KEY = '\K[0-9a-f]{64}" index.html)
          test "$key" != "$old"
          grep -rlZ --include='*.html' "const KEY = '" . | xargs -0 sed -i "s/const KEY = '[0-9a-f]\{64\}'/const KEY = '$key'/"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5