name: Deploy Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
     - 'index.html'
     - 'durian.rent.js'
     - 'durian.rent.wasm'
     - 'danang.pmtiles'
     - 'robots.txt'
     - 'sitemap.xml'

  workflow_run:
    workflows:
      - Build bundle
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5