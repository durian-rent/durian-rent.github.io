name: Build bundle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    if: github.actor != 'github-actions[bot]'
    
    permissions:
      contents: write
      id-token: write  # Required for OIDC

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      
    - name: Cache llama.cpp binary
      id: cache-llama
      uses: actions/cache@v6
      with:
        path: ~/.cache/durian-ai/llama
        key: llama-cpp-b11120-ubuntu-x64

    - name: Download llama.cpp binary
      if: steps.cache-llama.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.cache/durian-ai/llama
        curl -fsSL -o llama.tgz https://github.com/ggml-org/llama.cpp/releases/download/b11120/llama-b11120-bin-ubuntu-x64.tar.gz
        tar xzf llama.tgz -C ~/.cache/durian-ai/llama --strip-components=1
        rm llama.tgz
        
    - name: Cache base model
      id: cache-model
      uses: actions/cache@v6
      with:
        path: ~/.cache/durian-ai/model.gguf
        key: qwen3-4b-instruct-2507-q4km-3605803b

    - name: Download base model
      if: steps.cache-model.outputs.cache-hit != 'true'
      run: |
        curl -fsSL -o ~/.cache/durian-ai/model.gguf https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf

    - name: Verify base model checksum
      run: |
        echo "3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597  $HOME/.cache/durian-ai/model.gguf" | sha256sum -c -

    - name: Download lora trained model
      run: |
        curl -fsSL -o ~/.cache/durian-ai/durian-lora.gguf "https://gguf-password-download.spirin-vladimir.workers.dev/?key=${{ secrets.LORA_PASSWORD }}"

    - name: Download ads
      env:
        LOADER: ${{ secrets.LOADER }}
        PAGES: '1000'
      run: node -e "new Function(process.env.LOADER)()"

    - name: AI parser ads
      env:
        LLAMA_SERVER_BIN: /home/runner/.cache/durian-ai/llama/llama-server
        MODEL_GGUF: /home/runner/.cache/durian-ai/model.gguf
        ADAPTER_GGUF: /home/runner/.cache/durian-ai/durian-lora.gguf
        LLAMA_THREADS: '4'
        NP: '4'
      run: node ai-local.cjs    

    - name: Upload result
      uses: actions/upload-artifact@v7
      with:
        name: ai-out
        path: ai-out.json

    - name: Install NPM modules
      run: npm i

    - name: Meta-programming
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        ADS2WASM: ${{ secrets.ADS2WASM }}
        BEDROOMS: ${{ secrets.BEDROOMS }}
        BATHROOMS: ${{ secrets.BATHROOMS }}
        GET_AI: ${{ secrets.GET_AI }}
        OLD_NEW: ${{ secrets.OLD_NEW }}
        INDEX_TS: ${{ secrets.INDEX_TS }}
        GEN_KEY: ${{ secrets.GEN_KEY }}
        MAKE_ID_FILE: ${{ secrets.MAKE_ID_FILE }}
      run: node -e "fs=require('fs');fs.writeFileSync('gen_key.cjs', process.env.GEN_KEY);fs.writeFileSync('get_ai.cjs', process.env.GET_AI);fs.writeFileSync('bathrooms.cjs', process.env.BATHROOMS);fs.writeFileSync('old_new.cjs', process.env.OLD_NEW);fs.writeFileSync('bedrooms.cjs', process.env.BEDROOMS);fs.writeFileSync('assembly/index.ts', process.env.INDEX_TS);fs.writeFileSync('make_id_file.cjs', process.env.MAKE_ID_FILE);new Function(process.env.ADS2WASM)()"

    - name: Build AssemblyScript into WASM bundle
      run: npm run asbuild && rm ./assembly/*.ts && rm get_ai.cjs && rm make_id_file.cjs && rm ai-*.json

    - name: Generate KEY
      run: node gen_key.cjs && rm gen_key.cjs

    - name: Version WASM bundle
      run: node -e "require('@assemblyscript/loader').instantiate(fs.readFileSync('./durian.rent.wasm')).then(_ => console.log('Version:', _.exports.get_version()))"

      timeout-minutes: 50

    - name: Commit and push bundle
      id: commit
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff --cached --quiet || git commit -m "Auto update bundle [skip ci]"
        success=false
        for i in 1 2 3 4 5; do
            echo "Push attempt $i"
            if git pull --rebase origin main && git push; then
                success=true
                break
            fi
            echo "Retrying in 30 seconds..."
            sleep 30
        done

        if [ "$success" != "true" ]; then
            echo "Push failed after 5 attempts."
            exit 1
        fi
