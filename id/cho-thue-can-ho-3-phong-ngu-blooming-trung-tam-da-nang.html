        'https://gemini.google.com',

    let og_png
    document.modelContext?.registerTool({
        name: 'get_site_info',
        title: 'Get durian.rent site information',
        description: 'Returns information about durian.rent and its purpose.',
        inputSchema: {
            type: "object",
            properties: {}
        },
        outputSchema: {
            type: 'object',
            properties: {
                URL: { type: 'string' },
                PWA: { type: 'boolean' },
                offline: { type: 'boolean' },
                listings_count: { type: 'number' },
                services: { type: 'array', items: { type: 'string' } },
                currency: { type: 'string' },
                price_period: { type: 'string' }
            },
            required: [
                'URL',
                'PWA',
                'offline',
                'purpose',
                'services',
                'listings_count',
                'currency',
                'price_period'
            ]
        },
        annotations: {
            readOnlyHint: true
        },
        execute: async () => {
            gtag('event', 'webmcp', {tool: 'get_site_info'})
            return {
                content: [
                    {
                        type: 'text',
                        text: `
Durian.rent is an interactive rental-property map for Vietnam.

Purpose:
- Help users discover rental properties in Vietnam.
- Display rental listings on an interactive map.
- Allow listings to be filtered by monthly rental price.

The site currently contains ${ads.length} rental listings.
Prices are expressed in Vietnamese dong (VND).
`
                    },
                    {
                        type: 'image',
                        data: (og_png ??= new Uint8Array(await (await fetch('/og.png')).arrayBuffer())),
                        mimeType: 'image/png'
                    }
                ],
                structuredContent: {
                    URL: 'https://durian.rent',
                    PWA: true,
                    offline: true,
                    purpose: 'Interactive map for discovering rental properties in Da Nang, Vietnam.',
                    services: [
                        'Browse rental property listings',
                        'Filter listings by monthly rental price',
                        'View listings on an interactive map'
                    ],
                    listings_count: ads.length,
                    currency: 'VND',
                    price_period: 'monthly'
                }
            }
        }
    }, {exposedTo})

    document.modelContext?.registerTool({
        name: 'filter_listings_by_price',
        title: 'Find rentals by monthly price',
        description: 'Find rental property listings in Danang whose monthly rent is from the specified minimum price (inclusive) up to, but not including, the specified maximum price. Prices are in Vietnamese dong (VND). Use this tool when the user asks to find rentals within a price range.',
        inputSchema: {
            type: 'object',
            properties: {
                from: {
                    type: 'number',
                    minimum: 0,
                    description: 'Minimum monthly rental price in Vietnamese dong (VND), inclusive.'
                },
                to: {
                    type: 'number',
                    minimum: 0,
                    description: 'Maximum monthly rental price in Vietnamese dong (VND), exclusive.'
                }
            },
            required: ['from', 'to'],
            additionalProperties: false
        },
        outputSchema: {
            type: 'array',
            items: {
                type: 'object',
                properties: {
                    url: {
                        type: 'string',
                        format: 'uri'
                    },
                    price: {
                        type: 'number'
                    }
                },
                required: ['url', 'price'],
                additionalProperties: false
            }
        },
        annotations: {
            readOnlyHint: true
        },
        execute: ({from, to}) => {
            gtag('event', 'webmcp', {tool: 'filter_listings_by_price', from, to})
            return {
                structuredContent: ads
                    .filter(ad => ad.price >= from && ad.price < to)
                    .map(ad => ({
                        url: get_url(ad.id),
                        price: ad.price
                    }))
            }
        }
    }, {exposedTo})

        c.match(URL_MAPLIBRE)
        .then(r =>
            r || fetch(URL_MAPLIBRE)
            .then(r =>
                r.ok && c.put(URL_MAPLIBRE, r.clone()).then(_ => r)
            )
        )
    )
    .then(_ => _.text())
    .then(_ => eval(_))

    window.pmtiles_ready = caches.open('pmtiles_lib')
    .then(c =>
        c.match(URL_PMTILES)
        .then(r =>
            r || fetch(URL_PMTILES)
            .then(r =>
                r.ok && c.put(URL_PMTILES, r.clone()).then(_ => r)
            )
        )
    )
    .then(_ => _.text())
    .then(_ => eval(_.replace('var pmtiles=', 'window.pmtiles=')))


    window.cache_pmtiles_exist_and_loading = null

    caches.open('pmtiles')
    .then(c =>
        c.match('/danang.pmtiles')
        .then(_ => {
            if (!_) return
            cache_pmtiles_exist_and_loading = _.arrayBuffer()
            .then(_ => new Uint8Array(_))
        })
    )

    window.fetch = (url, opts = {}) => {
        if (
            cache_pmtiles_exist_and_loading &&
            String(url).includes('.pmtiles')
        ) return cache_pmtiles_exist_and_loading.then(cache => {
            const range = opts.headers?.get?.('Range')
                || opts.headers?.range
                || opts.headers?.Range

            if (range) {
                var [, from, to] =
                    /bytes=(\d+)-(\d+)/.exec(range)

                from = +from
                to = +to

                const chunk = cache.slice(from, to + 1)

                return Promise.resolve(
                    new Response(chunk, {
                        status: 206,
                        headers: {
                            'Content-Length': chunk.length,
                            'Content-Range': `bytes ${from}-${to}/${cache.length}`,
                            'Accept-Ranges': 'bytes'
                        }
                    })
                )
            }
        })

        return fetch_native(url, opts)
    }

                location.reload()
            }

            const expired_in = Number(get_key_created_at()) + 12 * 60 * 60 * 1000 - Date.now()//ms
            const expired_in_hours = Math.floor(expired_in / 1000 / 60 / 60)//hours
            const expired_in_hours_and_min =  Math.floor((expired_in - expired_in_hours * 60 * 60 * 1000) / 1000 / 60)
            console.log(`Key ${KEY} will be expired in ${expired_in_hours}h ${expired_in_hours_and_min}m`)
        }
        window.limit$ = {min: Infinity, max: -Infinity}
        window.raw_danang_bounds = get_danang_bounds()
        const ad_size = get_ad_size()
        const raw_ads = get_ads()
        window.dup_map = new Map()
        window.ads = Array(raw_ads.length / ad_size)
        for (var i = 0; i < raw_ads.length; i += ad_size) {
            var id = raw_ads[i]
            var price = raw_ads[i + 1]
            var longitude = raw_ads[i + 2]
            var latitude = raw_ads[i + 3]
            var category = raw_ads[i + 5]
            var area = raw_ads[i + 6]
            var m2 = raw_ads[i + 8]
            var publish = raw_ads[i + 9] 
            var bedrooms = raw_ads[i + 10] 
            var key = longitude + '-' + latitude
            var dup_set = dup_map.get(key) || new Set()
            dup_set.add(id)
            dup_map.set(key, dup_set)
            if (price < limit$.min) limit$.min = price
            if (price > limit$.max) limit$.max = price
            ads[i / ad_size] = { id, price, longitude, latitude, category, area, m2, publish, bedrooms }
        }
        dup_map.forEach((dup_set, key) =>
            dup_set.size == 1 &&
            dup_map.delete(key)
        )
        limit$.min = Math.max(
            Math.floor(limit$.min / 1e5) / 10,
            2
        )
        limit$.max = Math.min(
            Math.floor(limit$.max / 1e5) / 10,
            50
        )
        window.range$ = limit$.max - limit$.min

        var existed_likes
        if (likes_search_params.length) {
            existed_likes = get_likes()
            if (likes_search_params.length != existed_likes.length) {
                likes_search_params = existed_likes
                const url = new URL(location)
                url.searchParams.set('likes', existed_likes.join(','))
                history.replaceState({}, '', url)
            }
        } else if (likes_local_storage.length) {
            existed_likes = get_likes()
            if (likes_local_storage.length != existed_likes.length) {
                likes_local_storage = existed_likes
                localStorage.setItem('likes', existed_likes.join(','))
            }
        }

        if (location.pathname.split('/')[1] == 'id') {

            var ad_id = +document.querySelector('meta[name="ad:id"]').content
            var ad_current = ads.find(ad => ad.id == ad_id)
            if (ad_current) window.ad_current = ad_current
            else document.title = '[SOLD] ' + document.title

<script>
const $min_label = min.firstElementChild
const $max_label = max.firstElementChild
const $close = document.getElementById('close')
const $heart = document.getElementById('heart')
const $share = document.getElementById('share')
const $toast = document.getElementById('toast')
const $track = document.getElementById('track')
const $track_circle_inner = $track.querySelectorAll('circle')[1]
const $likes_count = document.getElementById('likes_count')
const $icon_filter = document.getElementById('icon-filter')
const $icon_dong = document.getElementById('icon-dong')
const $logo = document.getElementById('logo')
const $icon_install_apk = document.getElementById('icon-install-apk')
const $icon_install_ios = document.getElementById('icon-install-ios')
const $card = document.getElementById('card')
const $card_template = $card.querySelector('.card_content')
$card_template.after($card_template.cloneNode(true), $card_template.cloneNode(true))
const $cards = [...$card.querySelectorAll('.card_content')]
var $card_centre = $cards[0]
var $photo = $card_centre.querySelector('.photo_frame')
var $photos_container = $card_centre.querySelector('.photos_container')
var $seen = $card_centre.querySelector('.seen')
var $card_info = $card_centre.querySelector('.card_info')
const $title = document.getElementById('title')
const $last_update_time = document.getElementById('last_update_time')
const $last_update_time_value = document.getElementById('last_update_time_value')

var same_likes

const router = () => {
    const pathname = location.pathname.split('/')
    search_params = new URLSearchParams(location.search)
    likes_local_storage = (localStorage.getItem('likes') || '').split(',').map(Number).filter(Boolean)
    likes_search_params = search_params.has('likes') ? search_params.get('likes').split(',').map(Number).filter(Boolean) : []

    if (window.current_page == PAGE.SINGLE && !window.ad_current) {
        history.replaceState({}, '', '/')
        window.title = 'Durian Rent Map'
        current_page = PAGE.MAIN
    }

    if (pathname[1] == 'id') {
        window.current_page = PAGE.SINGLE
    } else {
        window.current_page = PAGE.MAIN
    }

    same_likes = likes_search_params.length == 0
        ? likes_local_storage.length == 0
        : likes_search_params.length == likes_local_storage.length && likes_search_params.every((id, i) =>
            likes_local_storage[i] == id
        )

    $likes_count.textContent = likes_local_storage.length || ''

    if (search_params.has('likes')) {
        map.setLayoutProperty('likes-filled', 'visibility', 'visible')
        map.setLayoutProperty('likes-outline', 'visibility', same_likes ? 'visible' : 'none')
        map.setLayoutProperty('likes-hitbox', 'visibility', 'visible')
        map.setLayoutProperty('price-circle', 'visibility', 'none')
        map.setLayoutProperty('price-circle-filtered', 'visibility', 'none')
        map.setLayoutProperty('price-text', 'visibility', 'none')
        map.setLayoutProperty('price-hitbox', 'visibility', 'none')
        if (same_likes) {
            current_page = PAGE.EDIT
            map.setLayoutProperty('price-text-shared-likes', 'visibility', 'none')
        } else {
            map.setLayoutProperty('price-text-shared-likes', 'visibility', 'visible')
            current_page = PAGE.SHARED
        }
    } else {
        map.setLayoutProperty('likes-filled', 'visibility', 'none')
        map.setLayoutProperty('likes-outline', 'visibility', 'none')
        map.setLayoutProperty('likes-hitbox', 'visibility', 'none')
        map.setLayoutProperty('price-circle', 'visibility', 'visible')
        map.setLayoutProperty('price-circle-filtered', 'visibility', 'visible')
        map.setLayoutProperty('price-text', 'visibility', 'visible')
        map.setLayoutProperty('price-hitbox', 'visibility', 'visible')
        map.setLayoutProperty('price-text-shared-likes', 'visibility', 'none')
        if (!window.current_page) current_page = PAGE.MAIN
    }
    current_page == PAGE.SHARED && console.log('SHARED')
    current_page == PAGE.MAIN && console.log('MAIN')
    current_page == PAGE.EDIT && console.log('EDIT')
    current_page == PAGE.SINGLE && console.log('SINGLE')
    $close.toggleAttribute('hidden', current_page != PAGE.SHARED)
    $heart.toggleAttribute('hidden', current_page == PAGE.SHARED)
    $share.toggleAttribute('hidden', current_page != PAGE.EDIT)
    toggler.toggleAttribute('hidden', current_page != PAGE.MAIN)
    filter.setAttribute('hidden', '')
    $icon_filter.removeAttribute('hidden')
    $icon_dong.setAttribute('hidden', '')
    $logo.removeAttribute('hidden')
    $last_update_time.removeAttribute('hidden')
    $card.toggleAttribute('hidden', current_page != PAGE.SINGLE)

    const likes = likes_search_params.length
        ? likes_search_params
        : likes_local_storage

    ads.forEach(ad =>
        map.setFeatureState(
            {
                source: 'prices',
                id: ad.id
            },
            {
                mode: current_page == PAGE.SINGLE
                    ? ad.id == ad_current.id
                        ? 'selected'
                        : 'other'
                    : ad.price < min$ || ad.price > max$
                        ? 'filtered'
                        : 'normal',
                liked: likes.includes(ad.id)
            }
        )
    )
    gtag('event', 'page_view', {page_title: document.title, page_location: location.href})
}

addEventListener('popstate', router)

function show_toast(msg) {
  $toast.textContent = msg
  $toast.removeAttribute('hidden')
  setTimeout(() => $toast.setAttribute('hidden', ''), 2000)
}

function user_animate() {
    const t = performance.now() * 0.005
    map.setPaintProperty(
        'user-pulse',
        'circle-radius',
         4 + (2 + 1.5 * Math.sin(t))
    )
    map.setPaintProperty(
        'user-pulse',
        'circle-opacity',
        0.3 * (1 + Math.cos(t))
    )
}
let waiting_tracking_animation_id = null;
const start_waiting_tracking = () => {
    const t = performance.now() / 1000;
    const period = 1.6 // seconds
    const phase = (t % period) / period
    const ease = 0.5 - 0.5 * Math.cos(phase * 2 * Math.PI)

    const r = 3 + 6 * ease // 3..9
    $track_circle_inner.setAttribute('r', r)

    waiting_tracking_animation_id = requestAnimationFrame(start_waiting_tracking)
}
const stop_waiting_tracking = () => {
    cancelAnimationFrame(waiting_tracking_animation_id)
    waiting_tracking_animation_id = null
    $track_circle_inner.setAttribute('r', 3)
}

let watch_id = null
let track_detecting = false

function stop_tracking() {
    if (watch_id != null) {
        navigator.geolocation.clearWatch(watch_id)
        watch_id = null
    }
    if (map.getLayer('user')) map.removeLayer('user')
    if (map.getLayer('user-pulse')) map.removeLayer('user-pulse')
    if (map.getSource('user')) map.removeSource('user')
    map.off('render', user_animate)
    track_detecting = false
    stop_waiting_tracking()
    $track_circle_inner.setAttribute('fill', 'none')
}

function start_tracking({ fly, auto_start }) {
    if (track_detecting || watch_id != null) return

    let first_position = true
    let user_location

    track_detecting = true
    $track_circle_inner.setAttribute('fill', '#3b82f6')
    start_waiting_tracking()

    watch_id = navigator.geolocation.watchPosition(
        position => {
            const { latitude, longitude } = position.coords
            if (
                latitude < raw_danang_bounds[1] ||
                latitude > raw_danang_bounds[3] ||
                longitude < raw_danang_bounds[0] ||
                longitude > raw_danang_bounds[2]
            ) {
                $track.setAttribute('hidden', null)
                stop_tracking()
                return
            } else {
                $track.removeAttribute('hidden')
            }
            if (first_position) {
                first_position = false
                track_detecting = false
                stop_waiting_tracking()

                user_location = {
                    type: 'FeatureCollection',
                    features: [{
                        type: 'Feature',
                        geometry: {
                            type: 'Point',
                            coordinates: [longitude, latitude]
                        },
                        properties: {}
                    }]
                }

                map.addSource('user', {
                    type: 'geojson',
                    data: user_location
                })

                map.addLayer({
                    id: 'user',
                    type: 'circle',
                    source: 'user',
                    paint: {
                        'circle-radius': 4,
                        'circle-color': '#3b82f6',
                    }
                })

                map.addLayer({
                    id: 'user-pulse',
                    type: 'circle',
                    source: 'user',
                    paint: {
                        'circle-radius': 4,
                        'circle-color': '#3b82f6',
                        'circle-opacity': 0.3
                    }
                })

                if (fly) map.flyTo({
                    center: [longitude, latitude],
                    zoom: 16.5
                })

                map.on('render', user_animate)
            } else {
                user_location.features[0].geometry.coordinates = [longitude, latitude]
                map.getSource('user').setData(user_location)
            }
        },
        error => {
            console.log(error.code, error.message)
            track_detecting = false
            stop_waiting_tracking()
            $track_circle_inner.setAttribute('fill', 'none')
        },
        {
            enableHighAccuracy: true,
            timeout: Infinity,
            maximumAge: 0
        }
    )
}

$track.onpointerup = () => {
    if (!navigator.geolocation) return
    if (watch_id != null) {
        localStorage.asked_track = 'no'
        stop_tracking()
        return
    }
    localStorage.asked_track = 'yes'
    start_tracking({fly: true})
}

function mark_install_success($icon_install) {
    ;[$icon_install_apk, $icon_install_ios].forEach(button => {
        button.style.color = '#888'
        button.style.cursor = 'default'
        button.style.opacity = 0.7
        button.style.pointerEvents = 'none'
        button.onpointerup = null
    })

    const check = document.createElementNS('http://www.w3.org/2000/svg', 'g')
    check.setAttribute('class', 'install-check')
    check.innerHTML = `
        <circle cx="226" cy="34" r="16" fill="#1fa75a"></circle>
        <path d="M218 34l6 6 10-12" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
    `
    const svg = $icon_install.querySelector('svg')
    svg.appendChild(check)
}

window.addEventListener('beforeinstallprompt', event_install => {
    event_install.preventDefault()
    $logo.style.cursor = 'pointer'
    $logo.style.pointerEvents = 'auto'

    $logo.onpointerup = () => {
        $icon_install_apk.toggleAttribute('hidden')
        $icon_install_ios.toggleAttribute('hidden')
    }

    $icon_install_apk.onpointerup = () => {
        event_install.prompt()
        event_install.userChoice.then(({ outcome }) => {
            if (outcome === 'accepted') mark_install_success($icon_install_apk)
        })
    }

    $icon_install_ios.onpointerup = () => {
        event_install.prompt()
        event_install.userChoice.then(({ outcome }) => {
            if (outcome == 'accepted') mark_install_success($icon_install_ios)
        })
    }
})

function toggle_like(id) {
    var liked
    const likes = new Set((localStorage.getItem('likes') || '').split(',').filter(_ => !!_).map(_ => Number(_)))
    if (likes.has(id)) {
        likes.delete(id)
        liked = false
    } else {
        likes.add(id)
        liked = true
    }
    $cards.forEach($c => $c.dataset.id == id && $c.querySelector('.card_heart').setAttribute('aria-pressed', liked))
    if ($maxi.dataset.id == id) $maxi.querySelector('.card_heart').setAttribute('aria-pressed', liked)
    const likes_string = [...likes].join(',')
    localStorage.setItem('likes', likes_string)
    $likes_count.textContent = likes.size || ''
    if (current_page == PAGE.EDIT) {
        if (window.map) map.setFeatureState(
            { source: 'prices', id },
            { liked }
        )
        const url = new URL(location)
        url.searchParams.set('likes', likes_string)
        history.replaceState({}, '', url)
    }
    return likes
}

var card_start_t = null
var card_start_x = 0
var card_start_y = 0
var card_start_small = true
var card_going_close = undefined
var card_prev_x = 0
var card_prev_prev_x = 0
var card_prev_y = 0
var card_prev_prev_y = 0
var card_end_t = null
var card_end_x = 0
var card_end_y = 0
var x_photo_min = null
var x_photo_max = null
var cur_x
var photo_swipe
var card_moved = false
var card_closed = true

$card.ontouchstart = e => {
    e.stopPropagation()
    card_moved = false
    if (e.target.closest('.card_heart')) return
    $card.style.transition = 'none'
    card_start_t = Date.now()
    card_start_x = e.changedTouches[0].screenX
    card_start_y = e.changedTouches[0].screenY
    card_prev_x = card_start_x
    card_prev_y = card_start_y
    card_prev_prev_x = card_start_x
    card_prev_prev_y = card_start_y
    var rect = $card.getBoundingClientRect()
    card_height = rect.height
    if (!y_card_min || detect_y_card_min == false) {
        detect_y_card_min = true
        y_card_min = card_height
    }
    y_card_max = Math.min(rect.width, 0.75 * window.innerHeight) +
        10 // addition for mover then aspect 1:1 for photo would be correct
        // where 10px is diff between padding and top padding
    card_going_close = undefined
    
    $photos_container.style.transition = 'none'
    x_photo_min = 0
    x_photo_max = (photo_total_count - 1) * photo_size
    cur_x = photo_current_index * photo_size
    photo_swipe = undefined
    carousel_swipe = undefined
    carousel_start_pos = carousel_pos
    for (const $c of $cards) $c.style.transition = 'none'
}
$card.ontouchmove = e => {
    e.stopPropagation()
    if (e.target.closest('.card_heart')) return
    try{ e?.preventDefault()} catch(e) {}
    card_prev_prev_x = card_prev_x
    card_prev_x = e.changedTouches[0].screenX
    card_prev_prev_y = card_prev_y
    card_prev_y = e.changedTouches[0].screenY
    
    var dx = card_prev_x - card_start_x
    var dy = card_prev_y - card_start_y

    if (photo_swipe == undefined) {
        if (Math.abs(dx) + Math.abs(dy) < 6) return
        card_moved = true
        photo_swipe = e.target.closest('.photo_frame') == $photo && 2 * Math.abs(dx) > Math.abs(dy)
        carousel_swipe = !photo_swipe && carousel_ids.length > 1 && 2 * Math.abs(dx) > Math.abs(dy)
    }
    
    if (photo_swipe) {
        var x = Math.max(x_photo_min, Math.min(x_photo_max, cur_x - dx))
        $photos_container.style.transform = `translate3d(-${x}px,0,0)`
        $photos_container.removeAttribute('hidden')
    } else if (carousel_swipe) {
        if (carousel_ids.length == 2 && (dx > 0) == (carousel_start_pos == 0)) return
        carousel_pos = carousel_start_pos - dx / carousel_step
        carousel_render()
    } else {
        $photos_container.setAttribute('hidden', '')
        var last_move_direction = dy > 0 ? 'down' : 'up'
        
        if (card_going_close == undefined) {
            card_going_close = card_start_small &&
                last_move_direction == 'down'
        }
        if (dy == 0) return

        var h = +$card.style.height.replace('px', '') || y_card_min
        var bottom = +$card.style.bottom.replace('px', '') || 0

        if (card_going_close) {
            var y = Math.max(0, Math.min(y_card_min, dy))
            $card.style.bottom = `-${y}px`
        } else {
            return //Disable min/mid views 
            var y = Math.max(y_card_min, Math.min(y_card_max, card_height - dy))
            $card.style.height = `${y}px`
            $card_info.setAttribute('hidden', '')
        }
    }
}
$card.ontouchend = e => {
    e.stopPropagation()
    if (e.target.closest('.card_heart')) return
    card_end_t = Date.now()
    card_end_x = e.changedTouches[0].screenX
    card_end_y = e.changedTouches[0].screenY
    var dt = card_end_t - card_start_t // user moved by finger in ms
    var dx = card_end_x - card_start_x // user moved by finger by px
    var dy = card_end_y - card_start_y // user moved by finger by px
    if (photo_swipe) {
        //var vX = Math.max(0.3, 1.5 * Math.abs(dx / dt))
        $photos_container.style.transition = 'transform 0.25s ease-out'
        var frames = Math.ceil(Math.abs(dx / photo_size))
        var last_move_direction = card_end_x > card_prev_prev_x ? 'left' : 'right'
        if (last_move_direction == 'right') {
            if (dx > 0) to_current() 
            else next_proto_right(frames)
        } else {
            if (dx < 0) to_current() 
            else next_proto_left(frames)
        }
        return
    }
    if (carousel_swipe) {
        var frames = Math.ceil(Math.abs(dx / carousel_step))
        if (carousel_ids.length == 2) frames = (dx > 0) == (carousel_start_pos == 0) ? 0 : 1
        var last_move_direction = card_end_x > card_prev_prev_x ? 'left' : 'right'
        var target = carousel_start_pos
        if (last_move_direction == 'right') {
            if (dx < 0) target += frames
        } else {
            if (dx > 0) target -= frames
        }
        var rest_path = Math.abs(target - carousel_pos) * carousel_step
        var rest_time_ms = rest_path / Math.max(0.4, 1.5 * Math.abs(dx / dt))
        carousel_render(target)
        $card.offsetWidth
        for (const $c of $cards) {
            $c.style.transition = `transform ${rest_time_ms / 1000}s linear`
            $c.style.transform = `translate3d(${($c.carousel_index - target) * carousel_step}px, 0, 0)`
        }
        carousel_pos = target
        return
    }
    var dY = null // future rest path for animation
    var dT = null // future rest time for animation
    var vY = Math.max(0.4, 1.5 * Math.abs(dy / dt))
    var h = +$card.style.height.replace('px', '') || y_card_min
    var b = +$card.style.bottom.replace('px', '') || 0
    var last_move_direction = card_end_y > card_prev_prev_y
        ? 'down'
        : 'up'

    if (card_going_close) {
        if (last_move_direction == 'down') {
            carousel_unselect()
            card_closed = true
            dY = y_card_min - b
            dT = Math.abs(dY / (2.5 * vY))
            $card.style.transition = `bottom ${(dT/1000).toFixed(2)}s linear`
            $card.style.bottom = `-${y_card_min}px`
        } else {
            dY = 0 - b
            dT = Math.abs(dY / (1.5 * vY))
            $card.style.transition = `bottom ${(dT/1000).toFixed(2)}s linear`
            $card.style.bottom = 0
        }
    }
}

var carousel_ids = []
var carousel_pos = 0
var carousel_start_pos = 0
var carousel_swipe
var carousel_selected = null
var carousel_step = 0

const carousel_mod = index => ((index % carousel_ids.length) + carousel_ids.length) % carousel_ids.length

function carousel_order(id) {
    const bounds = map.getBounds()
    return ads
        .filter(ad => ad.id == id || (
            bounds.contains([ad.longitude, ad.latitude]) &&
            map.getFeatureState({ source: 'prices', id: ad.id }).mode != 'filtered'
        ))
        .sort((a, b) => a.price - b.price || a.id - b.id)
        .map(ad => ad.id)
}

function carousel_select(id) {
    if (carousel_selected?.id == id) return
    carousel_unselect()
    carousel_selected = { id, mode: map.getFeatureState({ source: 'prices', id }).mode }
    map.setFeatureState({ source: 'prices', id }, { mode: 'selected', hover: false })
}

function carousel_unselect() {
    if (!carousel_selected) return
    const { id, mode } = carousel_selected
    carousel_selected = null
    if (map.getFeatureState({ source: 'prices', id }).mode == 'selected') map.setFeatureState({ source: 'prices', id }, { mode })
}

function carousel_open(id) {
    carousel_unselect()
    carousel_ids = carousel_order(id)
    carousel_pos = carousel_ids.indexOf(id)
    $card_centre = $cards[1]
    if (!carousel_step) carousel_step = $card_centre.getBoundingClientRect().width + 0.05 * $card.clientWidth
    $cards.forEach(($c, i) => {
        $c.carousel_index = carousel_pos + i - 1
        $c.style.transition = 'none'
        $c.querySelector('.card_info').removeAttribute('hidden')
        fill_card($c, carousel_ids[carousel_mod($c.carousel_index)])
    })
    carousel_centre($cards[1])
    carousel_render()
}

function carousel_render(centre = Math.round(carousel_pos)) {
    if (carousel_ids.length < 3) centre = Math.max(0, Math.min(carousel_ids.length - 1, centre))
    const wanted = [centre - 1, centre, centre + 1]
    const spare = $cards.filter($c => !wanted.includes($c.carousel_index))
    for (const index of wanted) {
        if ($cards.some($c => $c.carousel_index == index)) continue
        const $c = spare.pop()
        $c.carousel_index = index
        fill_card($c, carousel_ids[carousel_mod(index)])
    }
    for (const $c of $cards) {
        $c.style.visibility = carousel_ids.length > 2 || ($c.carousel_index >= 0 && $c.carousel_index < carousel_ids.length) ? '' : 'hidden'
        $c.style.transform = `translate3d(${($c.carousel_index - carousel_pos) * carousel_step}px, 0, 0)`
    }
    const $centre = $cards.find($c => $c.carousel_index == centre)
    if ($centre != $card_centre) carousel_centre($centre)
}

function carousel_centre($c) {
    if ($c != $card_centre) $card_centre.dataset.photo = photo_current_index
    $card_centre = $c
    $cards.forEach($x => $x.inert = $x != $c)
    $photo = $c.querySelector('.photo_frame')
    $photos_container = $c.querySelector('.photos_container')
    $seen = $c.querySelector('.seen')
    $card_info = $c.querySelector('.card_info')
    photo_current_index = Number($c.dataset.photo) || 0
    photo_total_count = $photos_container.children.length
    window.card_id = Number($c.dataset.id)
    carousel_select(window.card_id)
}

const $maxi = document.getElementById('maxi')
const $maxi_strip = $maxi.querySelector('.maxi_strip')
const $maxi_count = $maxi.querySelector('.maxi_count')
var maxi_photo_index = 0
var maxi_start_x = 0
var maxi_start_y = 0
var maxi_start_t = null
var maxi_prev_x = 0
var maxi_prev_prev_x = 0
var maxi_prev_y = 0
var maxi_swipe

function maxi_open(id) {
    const ad = ads.find(ad => ad.id == id)
    const kind = get_category_for_user(ad.category)
    const district = get_area_v2_for_user(ad.area)
    const $c = $cards.find($c => $c.dataset.id == id)
    $maxi.dataset.id = id
    $maxi.querySelector('h1').textContent = ad.bedrooms && (kind == 'Apartment' || kind == 'House')
        ? `${ad.bedrooms}-bedroom ${kind.toLowerCase()} in ${district}`
        : `${kind} in ${district}`
    $maxi.querySelector('.street').textContent = $c.querySelector('.street').textContent
    $maxi.querySelector('.area').textContent = district
    $maxi.querySelector('.amount').textContent = $c.querySelector('.amount').textContent
    $maxi.querySelector('.publish').textContent = $c.querySelector('.publish').textContent
    $maxi.querySelector('.card_heart').setAttribute('aria-pressed', $c.querySelector('.card_heart').getAttribute('aria-pressed'))
    const living = kind == 'Apartment' || kind == 'House'
    for (const [name, value, shown] of [['bedrooms', ad.bedrooms, living], ['bathrooms', 0, kind != 'Land Plot'], ['area', ad.m2 && `${ad.m2} m<sup>2</sup>`, true]]) {
        const $pod = $maxi.querySelector(`[data-pod="${name}"]`)
        $pod.hidden = !shown
        $pod.classList.toggle('unk', !value)
        $pod.querySelector('b').innerHTML = value || ''
    }
    $maxi.querySelector('.maxi_link').href = get_url(id)
    $maxi_strip.innerHTML = $c.querySelector('.photos_container').innerHTML
    maxi_photo_index = 0
    $maxi_strip.style.transition = 'none'
    $maxi_strip.style.transform = 'translate3d(0,0,0)'
    $maxi_count.textContent = $maxi_strip.children.length ? `1 / ${$maxi_strip.children.length}` : ''
    $maxi.style.transition = 'none'
    $maxi.style.transform = 'translate3d(0,0,0)'
    $maxi.scrollTop = 0
    $maxi.removeAttribute('hidden')
    maxi_about($c.dataset.body)
}

function maxi_about(text) {
    const $about = $maxi.querySelector('.maxi_about')
    const $desc = $about.querySelector('.desc')
    const $more = $about.querySelector('.more')
    $about.hidden = !text
    $about.removeAttribute('data-open')
    $desc.textContent = text || ''
    $more.textContent = 'Show more'
    $more.hidden = $desc.scrollHeight <= $desc.clientHeight
}

function maxi_close() {
    $maxi.style.transition = 'transform 0.1s ease'
    $maxi.style.transform = `translate3d(0, ${$maxi.clientHeight}px, 0)`
}

$maxi.onclick = e => {
    if (e.target.closest('.maxi_close')) return maxi_close()
    if (e.target.closest('.card_heart')) return toggle_like(Number($maxi.dataset.id))
    const $more = e.target.closest('.more')
    if ($more) {
        const $about = $more.closest('.maxi_about')
        $about.toggleAttribute('data-open')
        return $more.textContent = $about.hasAttribute('data-open') ? 'Show less' : 'Show more'
    }
    const $link = e.target.closest('.maxi_link')
    if ($link) {
        const id = Number($maxi.dataset.id)
        gtag('event', 'ad_click', {ad_id: id, ad_url: $link.href, price: ads.find(ad => ad.id == id).price, page: current_page})
    }
}

$maxi.ontouchstart = e => {
    e.stopPropagation()
    if (e.target.closest('.ctl')) return
    maxi_start_t = Date.now()
    maxi_start_x = e.changedTouches[0].screenX
    maxi_start_y = e.changedTouches[0].screenY
    maxi_prev_x = maxi_start_x
    maxi_prev_y = maxi_start_y
    maxi_prev_prev_x = maxi_start_x
    maxi_swipe = undefined
    $maxi_strip.style.transition = 'none'
}
$maxi.ontouchmove = e => {
    e.stopPropagation()
    if (e.target.closest('.ctl')) return
    maxi_prev_prev_x = maxi_prev_x
    maxi_prev_x = e.changedTouches[0].screenX
    maxi_prev_y = e.changedTouches[0].screenY
    var dx = maxi_prev_x - maxi_start_x
    var dy = maxi_prev_y - maxi_start_y
    if (maxi_swipe == undefined) {
        if (Math.abs(dx) + Math.abs(dy) < 6) return
        if (e.target.closest('.maxi_photos') && 2 * Math.abs(dx) > Math.abs(dy)) maxi_swipe = 'photo'
        else maxi_swipe = 'scroll'
    }
    if (maxi_swipe == 'photo') {
        e.preventDefault()
        var width = $maxi.clientWidth
        var x = Math.max(0, Math.min(($maxi_strip.children.length - 1) * width, maxi_photo_index * width - dx))
        $maxi_strip.style.transform = `translate3d(-${x}px,0,0)`
    }
}
$maxi.ontouchend = e => {
    e.stopPropagation()
    if (e.target.closest('.ctl')) return
    var end_x = e.changedTouches[0].screenX
    var dt = Date.now() - maxi_start_t
    var dx = end_x - maxi_start_x
    if (maxi_swipe == 'photo') {
        var width = $maxi.clientWidth
        var count = $maxi_strip.children.length
        var from = Math.max(0, Math.min((count - 1) * width, maxi_photo_index * width - dx))
        var frames = Math.ceil(Math.abs(dx / width))
        var last_move_direction = end_x > maxi_prev_prev_x ? 'left' : 'right'
        if (last_move_direction == 'right') {
            if (dx < 0) maxi_photo_index = Math.min(count - 1, maxi_photo_index + frames)
        } else {
            if (dx > 0) maxi_photo_index = Math.max(0, maxi_photo_index - frames)
        }
        var rest_time_ms = Math.abs(maxi_photo_index * width - from) / Math.max(0.4, 1.5 * Math.abs(dx / dt))

function fill_card($c, id) {
    const ad = ads.find(ad => ad.id == id)
    const url = get_url(id)
    const $frame = $c.querySelector('.photo_frame')
    const $strip = $c.querySelector('.photos_container')
    $c.dataset.id = id
    $c.dataset.photo = 0
    $c.dataset.body = ''
    const likes = new Set((localStorage.getItem('likes') || '').split(',').filter(_ => !!_).map(_ => Number(_)))
    $c.querySelector('.card_heart').setAttribute('aria-pressed', likes.has(id))

    var photos_urls
    try {
        photos_urls = get_ad_img_urls(id)
        if ('serviceWorker' in navigator) navigator.serviceWorker.controller?.postMessage({type: 'PHOTO_PRIORITY', url: photos_urls[0]})
    } catch (e) {
        console.error(`ERROR: get_ad_img_urls(${id}) ${url}`, e)
        photos_urls = []
    }
    $strip.style.transition = 'none'
    $strip.style.transform = `translate3d(0,0,0)`
    for (var i = 0, $; i < photos_urls.length; i++) {
        if ($strip.children[i]) {
            $ = $strip.children[i]
            $.style.backgroundImage = `url("${photos_urls[i]}")`
        } else {
            $ = document.createElement('div')
            $.className = 'photo'
            $.style.backgroundImage = `url("${photos_urls[i]}")`
            $strip.appendChild($)
        }
        if (i == 0) $frame.style.backgroundImage = `url("${photos_urls[i]}")`
    }
    while ($strip.children.length > photos_urls.length) {
        $strip.lastElementChild.remove()
    }
    $c.querySelector('.seen').textContent = photos_urls.length ? `1 / ${photos_urls.length}` : ''
    var price_string = String(ad.price).split('').reverse()
    var price_string_space = ''
    for (var i = 0; i < price_string.length; i++) {
        if (i != 0 && i % 3 == 0)
            price_string_space = ' ' + price_string_space
        price_string_space = price_string[i] + price_string_space
    }
    $c.querySelector('.amount').textContent = price_string_space
    $c.querySelector('.category').textContent = get_category_for_user(ad.category)
    $c.querySelector('.area').textContent = get_area_v2_for_user(ad.area)
    $c.querySelector('.m2').textContent = ad.m2
    $c.querySelector('.bed').textContent = ad.bedrooms || '-'
    $c.querySelector('.publish').textContent = `${ago(ad.publish)}`
    $c.querySelector('.street').textContent = ''
    load_font()

    fetch(
        '/ads.bin',
        {headers: {'Range': `bytes=${get_ad_range(id).join('-')}`}}
    )
    .then(_ => _.arrayBuffer())
    .then(ab => {
        const view = new DataView(ab)
        const decoder = new TextDecoder('utf-8')
        var offset = 0

        const subjectLen = view.getUint32(offset, false)
        offset += 4
        const subject = decoder.decode(new Uint8Array(ab, offset, subjectLen))
        offset += subjectLen

        const bodyLen = view.getUint32(offset, false)
        offset += 4
        const body = decoder.decode(new Uint8Array(ab, offset, bodyLen))
        offset += bodyLen

        const streetLen = view.getUint32(offset, false)
        offset += 4
        const street_name = decoder.decode(new Uint8Array(ab, offset, streetLen))
        return [subject, body, street_name]
    })
    .then(([subject, body, street_name]) => {
        if ($c.dataset.id != id) return
        $c.querySelector('.street').textContent = street_name
        $c.dataset.body = body
        if ($maxi.dataset.id == id) {
            $maxi.querySelector('.street').textContent = street_name
            maxi_about(body)
        }
        console.log(
            'subject:', subject,
            'body:', body,
            'street_name:', street_name
        )
    })
}

function next_proto_right(frames) {

    if (photo_current_index + frames < photo_total_count) {
        photo_current_index += frames
        var x = photo_current_index * photo_size

       next_proto_right(frames - 1)

function next_proto_left(frames) {
    if (frames == 0) return
    if (photo_current_index - frames >= 0) {
        photo_current_index -= frames
        var x = photo_current_index * photo_size
        $photos_container.style.transform = `translate3d(-${x}px,0,0)`
        show_seen()
        $photo.style.backgroundImage = $photos_container.children[photo_current_index].style.backgroundImage
    } else {
        next_proto_left(frames - 1)
    }
}

const limit = {
    min: null,
    max: null
}
var range
const step$ = 0.1
const get_label = y => {
    const abs_pos = (y - limit.min) / range
    const pos$ = limit$.min + range$ * abs_pos
    return pos$.toFixed(1)
}
const get_y_by_$ = $ => {
    const abs_pos = ($ - limit$.min) / range$
    const y = limit.min + range * abs_pos
    return y
}
var rect_scale, rect_min
var min_y, max_y

function pointerdown(e) {
    const el = e.currentTarget
    el.setPointerCapture(e.pointerId)
    let y = e.clientY
    const pos = y - rect_scale.bottom + rect_min.height / 2
    const dist_min = Math.abs(min_y - pos)
    const dist_max = Math.abs(max_y - pos)
    var target = dist_min < dist_max ? min : max
    function pointermove(e) {
        const dy = e.clientY - y
        y = e.clientY

        if (target == min) {
            update_min_y(dy)
        }
        if (target == max) {
            update_max_y(dy)
        }
    }

    function pointerup(e) {
        el.releasePointerCapture(e.pointerId)
        el.removeEventListener('pointermove', pointermove)
        el.removeEventListener('pointerup', pointerup)
        el.removeEventListener('pointercancel', pointerup)
    }

    el.addEventListener('pointermove', pointermove)
    el.addEventListener('pointerup', pointerup)
    el.addEventListener('pointercancel', pointerup)
}

var steps_count
var step
var min$
var max$

function filter_close() {
    filter.setAttribute('hidden', '')
    $icon_dong.setAttribute('hidden', '')
    $icon_filter.removeAttribute('hidden')

}

toggler.onpointerup = e => {
    if (filter.hasAttribute('hidden')) {
        card_hide()
        filter.removeAttribute('hidden')
        $icon_dong.removeAttribute('hidden')
        $icon_filter.setAttribute('hidden', '')
    } else {
        filter_close()
        return
    }
    rect_scale = scale.getBoundingClientRect()
    rect_min = min.getBoundingClientRect()
    limit.min = 0
    limit.max = 0 - (rect_scale.height - rect_min.height)
    range = limit.max - limit.min
    steps_count = (limit$.max - limit$.min) / step$
    step = (limit.max - limit.min) / steps_count

    min$ = +localStorage.getItem('min$')
    max$ = +localStorage.getItem('max$')

    min_y = min$ ? get_y_by_$(min$ / 1e6) : limit.min
    max_y = max$ ? get_y_by_$(max$ / 1e6) : limit.max

    min.style.transform = `translate3d(0, ${min_y}px, 0)`
    max.style.transform = `translate3d(0, ${max_y}px, 0)`
    $min_label.textContent = get_label(min_y)
    $max_label.textContent = get_label(max_y)
    min$ = $min_label.textContent * 1e6,
    max$ = $max_label.textContent * 1e6,
    apply_filter()

    filter.addEventListener('pointerdown', pointerdown)

    toggler.onwheel = onwheel
    filter.onwheel = onwheel

    function onwheel(e) {
        e.preventDefault()
        const DOWN = e.deltaY > 0
        const UP   = e.deltaY < 0
        if (!e.deltaY) return
        const dy = DOWN ? -step : step
        const pos = e.clientY - rect_scale.bottom + rect_min.height / 2
        const dist_min = Math.abs(min_y - pos)
        const dist_max = Math.abs(max_y - pos)
        var target = null
        if (dist_min < dist_max) {
            if (DOWN) {
                if (min_y == limit.min) {
                    target = null
                    // swith target max
                    if (max_y == min_y - rect_min.height) {
                        target = null // max near min
                    } else {
                        target = max
                    }
                } else {
                    target = min
                }
            }
            if (UP) {
                if (min_y == max_y + rect_min.height) {
                    target = null
                    /*
                    // switch target max
                    if (max_y == limit.max) {
                        target = null // max & min at top border
                    } else {
                        target = max
                    }
                    */
                } else {
                    target = min
                }
            }
        } else {
            if (DOWN) {
                if (max_y == min_y - rect_min.height) {
                    target = null
                    /*
                    // swith target min
                    if (min_y == limit.min) {
                        target = null // max & min at lower border
                    } else {
                        target = min
                    }
                    */
                } else {
                    target = max
                }
            }
            if (UP) {
                if (max_y == limit.max) {
                    target = null
                    //target min
                    if (min_y == max_y + rect_min.height) {
                        target = null // max & min at top border
                    } else {
                        target = min
                    }
                } else {
                    target = max
                }
            }
        }
        if (target == min) {
            update_min_y(dy)
        } else if (target == max) {
            update_max_y(dy)
        }
    }
}

update_min_y = dy => {
    min_y += dy
    if (min_y > limit.min) min_y = limit.min
    if (min_y - rect_min.height < max_y) min_y = max_y + rect_min.height
    min.style.transform = `translate3d(0, ${min_y}px, 0)`
    $min_label.textContent = get_label(min_y)
    min$ = $min_label.textContent * 1e6,
    localStorage.setItem('min$', min$)
    apply_filter()
}

update_max_y = dy => {
    max_y += dy
    if (max_y < limit.max) max_y = limit.max
    if (max_y + rect_min.height > min_y) max_y = min_y - rect_min.height
    max.style.transform = `translate3d(0, ${max_y}px, 0)`
    $max_label.textContent = get_label(max_y)
    max$ = $max_label.textContent * 1e6
    localStorage.setItem('max$', max$)
    apply_filter()
}

function throttle(func, wait, options) {
  var timeout, context, args, result;
  var previous = 0;
  if (!options) options = {};

  var later = function() {
    previous = options.leading === false ? 0 : Date.now();
    timeout = null;
    result = func.apply(context, args);
    if (!timeout) context = args = null;
  };

  var throttled = function() {
    var _now = Date.now();
    if (!previous && options.leading === false) previous = _now;
    var remaining = wait - (_now - previous);
    context = this;
    args = arguments;
    if (remaining <= 0 || remaining > wait) {
      if (timeout) {
        clearTimeout(timeout);
        timeout = null;
      }
      previous = _now;
      result = func.apply(context, args);
      if (!timeout) context = args = null;
    } else if (!timeout && options.trailing !== false) {
      timeout = setTimeout(later, remaining);
    }
    return result;
  };

  throttled.cancel = function() {
    clearTimeout(timeout);
    previous = 0;
    timeout = context = args = null;
  };

  return throttled;
}

ago = t => {
    var dt = Date.now() - t
    var s = Math.round(dt / 1000)
    if (s < 1) return 'now'
    if (s == 1) return s + ' second'
    if (s < 60) return s + ' seconds'
    var m = Math.round(s / 60)
    if (m == 1) return m + ' minute'
    if (m < 60) return m + ' minutes'
    var h = Math.round(m / 60)
    if (h == 1) return h + ' hour'
    if (h < 24) return h + ' hours'
    var d = Math.round(h / 24)
    if (d == 1) return d + ' day'
    if (d < 7) return d + ' days'
    var w = Math.round(d / 7)
    if (w == 1) return w + ' week'
    if (w < 4) return w + ' weeks'
    var M = Math.round(d / 30)
    if (M == 1) return M + ' month'
    if (M < 12) return M + ' months'
    var Y = Math.round(d / 365)
    if (Y == 1) return Y + ' year'
    return Y + ' years'
}

        const map_args = {
            container: 'map',
            style,
            maxBounds: new maplibregl.LngLatBounds(
                [raw_danang_bounds[0], raw_danang_bounds[1]],
                [raw_danang_bounds[2], raw_danang_bounds[3]]
            ),
            attributionControl: false
        }
        if (likes_search_params.length) {
            const likes_bounds = get_likes_bounds()
            map_args.bounds = [
                [likes_bounds[0], likes_bounds[1]],
                [likes_bounds[2], likes_bounds[3]]
            ]
            map_args.fitBoundsOptions = {padding: 100}
        } else {
            map_args.center = window.current_page && current_page == PAGE.SINGLE
                ? [ad_current.longitude, ad_current.latitude]
                : get_center()
            map_args.zoom = window.current_page && current_page == PAGE.SINGLE ? 15 : get_zoom()
        }

        window.map = new maplibregl.Map(map_args)

        map.dragRotate.disable()
        map.touchZoomRotate.disableRotation()

        map.addImage('heart-filled', heart_filled, {sdf: true})
        map.addImage('heart-outline', heart_outline, {sdf: true})

        map.on('style.load', () => {
            if (
                initial_inner_size[0] != window.innerWidth ||
                initial_inner_size[1] != window.innerHeight
            ) map.resize()

            var hovered_price_id = null
            var hovered_likes_id = null

            map.on('mousemove', 'price-hitbox', e => {
                const click_priority = {normal: 1, filtered: 0}
                e.features.sort((a, b) =>
                    click_priority[b.state.mode] - click_priority[a.state.mode]
                )
                const id = e.features[0].id
                if (id == hovered_price_id) return
                if (hovered_price_id != null) {
                    map.setFeatureState(
                        { source: 'prices', id: hovered_price_id },
                        { hover: false }
                    )
                }

                hovered_price_id = id

                map.setFeatureState(
                    { source: 'prices', id: hovered_price_id },
                    { hover: true }
                )

                map.getCanvas().style.cursor = 'pointer'
            })
            map.on('mouseleave', 'price-hitbox', e => {
                const $ = document.elementFromPoint(e.point.x, e.point.y)
                if ($?.closest('#card')) return

                if (hovered_price_id != null) {
                    map.setFeatureState(
                        { source: 'prices', id: hovered_price_id },
                        { hover: false }
                    )
                }

                hovered_price_id = null
                map.getCanvas().style.cursor = ''
            })
            map.on('mousemove', 'likes-hitbox', e => {
                var id
                if (current_page == PAGE.SHARED) {
                    var hovered_feature = e.features.find(_ => likes_search_params.includes(_.id))
                    if (hovered_feature) {
                        id = hovered_feature.id
                    } else {
                        return
                    }
                } else {
                    var id = (
                        e.features.find(_ => _.state.liked) ||
                        e.features[0]
                    ).id
                }

                if (hovered_likes_id != null && id != hovered_likes_id) {
                    map.setFeatureState(
                        { source: 'prices', id: hovered_likes_id },
                        { hover: false }
                    )
                }

                hovered_likes_id = id

                map.setFeatureState(
                    { source: 'prices', id: hovered_likes_id },
                    { hover: true }
                )

                map.getCanvas().style.cursor = 'pointer'
            })
            map.on('mouseleave', 'likes-hitbox', e => {
                if (hovered_likes_id != null) {
                    map.setFeatureState(
                        { source: 'prices', id: hovered_likes_id },
                        { hover: false }
                    )
                }

                hovered_likes_id = null
                map.getCanvas().style.cursor = ''
            })

            map.on('click', 'likes-hitbox', e => {
                var id = (
                    e.features.find(_ => _.state.liked) ||
                    e.features[0]
                ).id
                if (current_page == PAGE.SHARED) {
                    var hovered_feature = e.features.find(_ => likes_search_params.includes(_.id))
                    if (hovered_feature) {
                        id = hovered_feature.id
                    } else {
                        return
                    }
                    const url = get_url(id)
                    console.log('https://durian.rent/id/' + id)
                    gtag('event', 'ad_click', {ad_id: id, ad_url: url, price: hovered_feature.properties.price, page: current_page})
                    window.open(url, '_blank')
                    return
                }
                var likes = toggle_like(id)
            })
            map.on('click', 'price-hitbox', e => {
                const click_priority = {normal: 1, filtered: 0}
                e.features.sort((a, b) =>
                    click_priority[b.state.mode] - click_priority[a.state.mode]
                )
                const id = e.features[0].id
                const price = e.features[0].properties.price
                const url = get_url(id)
                if (!is_touch_vertical()) {
                    gtag('event', 'ad_click', {ad_id: id, ad_url: url, price, page: current_page})
                    window.open(url, '_blank')
                    return
                }

                if (!filter.hasAttribute('hidden')) filter_close()
                $card.removeAttribute('hidden')
                $card.style.transition = 'none'
                if (card_closed) $card.style.transform = `translate3d(0, ${$card.offsetHeight}px, 0)`
                $card.style.bottom = 0
                $card.style.height = ''
                detect_y_card_min = false
                carousel_open(id)
                $card.offsetHeight
                $card.style.transition = 'transform 0.1s ease'
                $card.style.transform = 'translate3d(0, 0, 0)'
                card_closed = false
            })
            map.on('click', e => {
                features = map.queryRenderedFeatures(e.point, {
                    layers: ['price-hitbox']
                })
                if (!features || !features.length) {
                    card_hide()
                    if (current_page == PAGE.SINGLE) {
                        current_page = PAGE.MAIN
                        history.pushState({}, '', '/')
                        router()
                    }
                    return
                }
            })
            map.on('moveend', () => {
                if (card_closed) return
                const ids = carousel_order(card_id)
                if (ids.length == carousel_ids.length && ids.every((id, i) => carousel_ids[i] == id)) return
                carousel_ids = ids
                carousel_pos = ids.indexOf(card_id)
                const sides = $cards.filter($c => $c != $card_centre).sort((a, b) => a.carousel_index - b.carousel_index)
                $card_centre.carousel_index = carousel_pos
                sides[0].carousel_index = carousel_pos - 1
                sides[1].carousel_index = carousel_pos + 1
                for (const $c of sides) {
                    $c.style.transition = 'none'
                    const id = carousel_ids[carousel_mod($c.carousel_index)]
                    if ($c.dataset.id != id) fill_card($c, id)
                }
                carousel_render()
            })

            navigator.geolocation && navigator.permissions?.query({ name: 'geolocation' })
            .then(geo_permission => {
                window.geo_permission = geo_permission
                if (geo_permission.state == 'granted' && localStorage.asked_track == 'yes') {
                    start_tracking({fly: false, auto_start: true})
                } else {
                    $track.removeAttribute('hidden')
                }
                geo_permission.onchange = () => {
                    if (geo_permission.state == 'granted' && localStorage.asked_track == 'yes') {
                        start_tracking({fly: true})
                    }
                    if (geo_permission.state == 'denied') {
                        stop_tracking()
                    }
                }
            })

            var time_values = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(new Date(+VER_WASM)).map(_ => [_.type, _.value]))
            $last_update_time_value.textContent =
                `${time_values.year}-${time_values.month}-${time_values.day} ${time_values.hour}:${time_values.minute}`

            router()
        })

        map.once('load', () => {
            if (cache_pmtiles_exist_and_loading == null) {
                fetch('/danang.pmtiles', {cache: 'no-store', priority: 'low'})
                .then(_ => {
                    if (_.ok && _.status == 200) {
                        caches.open('pmtiles')
                        .then(c => c.put('/danang.pmtiles', _.clone()))
                        .then(() =>
                            cache_pmtiles_exist_and_loading = _.arrayBuffer()
                            .then(_ => new Uint8Array(_))
                        )
                    }
                })
            }

            const GA = 'https://www.googletagmanager.com/gtag/js?id=G-RJ21952T38'
            caches.open('ga')
            .then(c =>
                c.match(GA)
                .then(r =>
                    r || fetch(GA, {priority: 'low'})
                    .then(r =>
                        r.ok && c.put(GA, r.clone()).then(_ => r)
                    )
                )
            )
            .then(r => r.text())
            .then(code => {
                const script = document.createElement('script')
                script.textContent = code
                document.head.appendChild(script)

                window.dataLayer = window.dataLayer || []
                window.gtag = function gtag(){dataLayer.push(arguments)}
                gtag('js', new Date())
                gtag('config', 'G-RJ21952T38')
            })
            
            const URL_ADS_PRICES = `/price.list?v=${VER_WASM}`
            caches.open('price.list')
            .then(cache =>
                cache.keys()
                .then(keys => keys[0])
                .then(r =>
                    r?.url.endsWith(`?v=${VER_WASM}`)
                        ? cache.match(r)
                        : Promise.resolve(r && cache.delete(r))
                        .then(() => fetch(URL_ADS_PRICES))
                        .then(response => {
                            cache.put(URL_ADS_PRICES, response.clone())
                            return response
                        })
                )
                .then(r => r.text())
                .then(set_ads_prices)
            )
        })

    })
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js?v=15')
