            required: [

                'offline',
                'purpose',

                'currency',
                'price_period'

    .then(_ => _.text())

            )

    .then(_ => _.text())
    .then(_ => eval(_.replace('var pmtiles=', 'window.pmtiles=')))


    window.cache_pmtiles_exist_and_loading = null

    caches.open('pmtiles')
    .then(c =>
        c.match('/danang.pmtiles')
        .then(_ => {
            if (!_) return
            cache_pmtiles_exist_and_loading = _.arrayBuffer()
            .then(_ => new Uint8Array(_))
        })
    )

    window.fetch = (url, opts = {}) => {
        if (
            cache_pmtiles_exist_and_loading &&
            String(url).includes('.pmtiles')
        ) return cache_pmtiles_exist_and_loading.then(cache => {
            const range = opts.headers?.get?.('Range')
                || opts.headers?.range
                || opts.headers?.Range

            if (range) {
                var [, from, to] =
                    /bytes=(\d+)-(\d+)/.exec(range)

                from = +from
                to = +to

                const chunk = cache.slice(from, to + 1)

                return Promise.resolve(
                    new Response(chunk, {
                        status: 206,
                        headers: {
                            'Content-Length': chunk.length,
                            'Content-Range': `bytes ${from}-${to}/${cache.length}`,
                            'Accept-Ranges': 'bytes'
                        }
                    })
                )
            }
        })

        return fetch_native(url, opts)
    }

                localStorage.setItem('last_reload_timestamp', Date.now())
                location.reload()
            }
        } else {
            const expired_in = Number(get_key_created_at()) + 12 * 60 * 60 * 1000 - Date.now()//ms
            const expired_in_hours = Math.floor(expired_in / 1000 / 60 / 60)//hours
            const expired_in_hours_and_min =  Math.floor((expired_in - expired_in_hours * 60 * 60 * 1000) / 1000 / 60)
            console.log(`Key ${KEY} will be expired in ${expired_in_hours}h ${expired_in_hours_and_min}m`)
        }
        window.limit$ = {min: Infinity, max: -Infinity}
        window.raw_danang_bounds = get_danang_bounds()
        const ad_size = get_ad_size()
        const raw_ads = get_ads()
        window.dup_map = new Map()
        window.ads = Array(raw_ads.length / ad_size)
        for (var i = 0; i < raw_ads.length; i += ad_size) {
            var id = raw_ads[i]
            var price = raw_ads[i + 1]
            var longitude = raw_ads[i + 2]
            var latitude = raw_ads[i + 3]
            var category = raw_ads[i + 5]
            var area = raw_ads[i + 6]
            var m2 = raw_ads[i + 8]
            var publish = raw_ads[i + 9] 
            var key = longitude + '-' + latitude
            var dup_set = dup_map.get(key) || new Set()
            dup_set.add(id)
            dup_map.set(key, dup_set)
            if (price < limit$.min) limit$.min = price
            if (price > limit$.max) limit$.max = price
            ads[i / ad_size] = { id, price, longitude, latitude, category, area, m2, publish }
        }
        dup_map.forEach((dup_set, key) =>
            dup_set.size == 1 &&
            dup_map.delete(key)
        )
        limit$.min = Math.max(
            Math.floor(limit$.min / 1e5) / 10,
            2
        )
        limit$.max = Math.min(
            Math.floor(limit$.max / 1e5) / 10,
            50
        )
        window.range$ = limit$.max - limit$.min

        var existed_likes
        if (likes_search_params.length) {
            existed_likes = get_likes()
            if (likes_search_params.length != existed_likes.length) {
                likes_search_params = existed_likes
                const url = new URL(location)
                url.searchParams.set('likes', existed_likes.join(','))

        .maplibregl-canvas {
            left: 0;
            position: absolute;
            top: 0;
        }

        .maplibregl-canvas-container.maplibregl-interactive {

            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        .maplibregl-canvas-container.maplibregl-interactive:active {
            cursor: grabbing;
        }

        .maplibregl-canvas-container.maplibregl-interactive.maplibregl-track-pointer {
            cursor: pointer;
        }

        /* touch handling - keep if you support mobile */

            border-width: thin;

            border-style: solid;

<script>
const $min_label = min.firstElementChild
const $max_label = max.firstElementChild
const $close = document.getElementById('close')

const $icon_install_ios = document.getElementById('icon-install-ios')

const $photos_container = document.getElementById('photos_container')
const $price = document.getElementById('price')
const $dots = document.getElementById('dots')
const $street = document.getElementById('street')
const $category = document.getElementById('category')
const $area = document.getElementById('area')
const $m2 = document.getElementById('m2')
const $publish = document.getElementById('publish')
const $title = document.getElementById('title')
const $contact = document.getElementById('contact')
const $card_heart = document.getElementById('card_heart')
const $card_close = document.getElementById('card_close')
const $last_update_time = document.getElementById('last_update_time')
const $last_update_time_value = document.getElementById('last_update_time_value')

var same_likes

const router = () => {
    const pathname = location.pathname.split('/')
    search_params = new URLSearchParams(location.search)
    likes_local_storage = (localStorage.getItem('likes') || '').split(',').map(Number).filter(Boolean)
    likes_search_params = search_params.has('likes') ? search_params.get('likes').split(',').map(Number).filter(Boolean) : []

    if (window.current_page == PAGE.SINGLE && !window.ad_current) {
        history.replaceState({}, '', '/')
        window.title = 'Durian Rent Map'
        current_page = PAGE.MAIN
    }

    if (pathname[1] == 'id') {
        window.current_page = PAGE.SINGLE
    } else {
        window.current_page = PAGE.MAIN
    }

    same_likes = likes_search_params.length == 0
        ? likes_local_storage.length == 0
        : likes_search_params.length == likes_local_storage.length && likes_search_params.every((id, i) =>
            likes_local_storage[i] == id
        )

    $likes_count.textContent = likes_local_storage.length || ''

    if (search_params.has('likes')) {
        map.setLayoutProperty('likes-filled', 'visibility', 'visible')
        map.setLayoutProperty('likes-outline', 'visibility', same_likes ? 'visible' : 'none')
        map.setLayoutProperty('likes-hitbox', 'visibility', 'visible')
        map.setLayoutProperty('price-circle', 'visibility', 'none')
        map.setLayoutProperty('price-circle-filtered', 'visibility', 'none')
        map.setLayoutProperty('price-text', 'visibility', 'none')
        map.setLayoutProperty('price-hitbox', 'visibility', 'none')
        if (same_likes) {
            current_page = PAGE.EDIT
            map.setLayoutProperty('price-text-shared-likes', 'visibility', 'none')
        } else {
            map.setLayoutProperty('price-text-shared-likes', 'visibility', 'visible')
            current_page = PAGE.SHARED
        }
    } else {
        map.setLayoutProperty('likes-filled', 'visibility', 'none')
        map.setLayoutProperty('likes-outline', 'visibility', 'none')
        map.setLayoutProperty('likes-hitbox', 'visibility', 'none')
        map.setLayoutProperty('price-circle', 'visibility', 'visible')
        map.setLayoutProperty('price-circle-filtered', 'visibility', 'visible')
        map.setLayoutProperty('price-text', 'visibility', 'visible')
        map.setLayoutProperty('price-hitbox', 'visibility', 'visible')
        map.setLayoutProperty('price-text-shared-likes', 'visibility', 'none')
        if (!window.current_page) current_page = PAGE.MAIN
    }
    current_page == PAGE.SHARED && console.log('SHARED')
    current_page == PAGE.MAIN && console.log('MAIN')
    current_page == PAGE.EDIT && console.log('EDIT')
    current_page == PAGE.SINGLE && console.log('SINGLE')
    $close.toggleAttribute('hidden', current_page != PAGE.SHARED)
    $heart.toggleAttribute('hidden', current_page == PAGE.SHARED)
    $share.toggleAttribute('hidden', current_page != PAGE.EDIT)
    toggler.toggleAttribute('hidden', current_page != PAGE.MAIN)
    filter.setAttribute('hidden', '')
    $icon_filter.removeAttribute('hidden')
    $icon_dong.setAttribute('hidden', '')
    $logo.removeAttribute('hidden')
    $last_update_time.removeAttribute('hidden')
    $card.toggleAttribute('hidden', current_page != PAGE.SINGLE)

    const likes = likes_search_params.length
        ? likes_search_params
        : likes_local_storage

    ads.forEach(ad =>
        map.setFeatureState(
            {
                source: 'prices',
                id: ad.id
            },
            {
                mode: current_page == PAGE.SINGLE
                    ? ad.id == ad_current.id
                        ? 'selected'
                        : 'other'
                    : ad.price < min$ || ad.price > max$
                        ? 'filtered'
                        : 'normal',
                liked: likes.includes(ad.id)
            }
        )
    )
    gtag('event', 'page_view', {page_title: document.title, page_location: location.href})
}

addEventListener('popstate', router)

function show_toast(msg) {
  $toast.textContent = msg
  $toast.removeAttribute('hidden')
  setTimeout(() => $toast.setAttribute('hidden', ''), 2000)
}

function user_animate() {
    const t = performance.now() * 0.005
    map.setPaintProperty(
        'user-pulse',
        'circle-radius',
         4 + (2 + 1.5 * Math.sin(t))
    )
    map.setPaintProperty(
        'user-pulse',
        'circle-opacity',
        0.3 * (1 + Math.cos(t))
    )
}
let waiting_tracking_animation_id = null;
const start_waiting_tracking = () => {
    const t = performance.now() / 1000;
    const period = 1.6 // seconds
    const phase = (t % period) / period
    const ease = 0.5 - 0.5 * Math.cos(phase * 2 * Math.PI)

    const r = 3 + 6 * ease // 3..9
    $track_circle_inner.setAttribute('r', r)

    waiting_tracking_animation_id = requestAnimationFrame(start_waiting_tracking)
}
const stop_waiting_tracking = () => {
    cancelAnimationFrame(waiting_tracking_animation_id)
    waiting_tracking_animation_id = null
    $track_circle_inner.setAttribute('r', 3)
}

let watch_id = null
let track_detecting = false

function stop_tracking() {
    if (watch_id != null) {
        navigator.geolocation.clearWatch(watch_id)
        watch_id = null
    }
    if (map.getLayer('user')) map.removeLayer('user')
    if (map.getLayer('user-pulse')) map.removeLayer('user-pulse')
    if (map.getSource('user')) map.removeSource('user')
    map.off('render', user_animate)
    track_detecting = false
    stop_waiting_tracking()
    $track_circle_inner.setAttribute('fill', 'none')
}

function start_tracking({ fly, auto_start }) {
    if (track_detecting || watch_id != null) return

    let first_position = true
    let user_location

    track_detecting = true
    $track_circle_inner.setAttribute('fill', '#3b82f6')
    start_waiting_tracking()

    watch_id = navigator.geolocation.watchPosition(
        position => {
            const { latitude, longitude } = position.coords
            if (
                latitude < raw_danang_bounds[1] ||
                latitude > raw_danang_bounds[3] ||
                longitude < raw_danang_bounds[0] ||
                longitude > raw_danang_bounds[2]
            ) {
                $track.setAttribute('hidden', null)
                stop_tracking()
                return
            } else {
                $track.removeAttribute('hidden')
            }
            if (first_position) {
                first_position = false
                track_detecting = false
                stop_waiting_tracking()

                user_location = {
                    type: 'FeatureCollection',
                    features: [{
                        type: 'Feature',
                        geometry: {
                            type: 'Point',
                            coordinates: [longitude, latitude]
                        },
                        properties: {}
                    }]
                }

                map.addSource('user', {
                    type: 'geojson',
                    data: user_location
                })

                map.addLayer({
                    id: 'user',
                    type: 'circle',
                    source: 'user',
                    paint: {
                        'circle-radius': 4,
                        'circle-color': '#3b82f6',
                    }
                })

                map.addLayer({
                    id: 'user-pulse',
                    type: 'circle',
                    source: 'user',
                    paint: {
                        'circle-radius': 4,
                        'circle-color': '#3b82f6',
                        'circle-opacity': 0.3
                    }
                })

                if (fly) map.flyTo({
                    center: [longitude, latitude],
                    zoom: 16.5
                })

                map.on('render', user_animate)
            } else {
                user_location.features[0].geometry.coordinates = [longitude, latitude]
                map.getSource('user').setData(user_location)
            }
        },
        error => {
            console.log(error.code, error.message)
            track_detecting = false
            stop_waiting_tracking()
            $track_circle_inner.setAttribute('fill', 'none')
        },
        {
            enableHighAccuracy: true,
            timeout: Infinity,
            maximumAge: 0
        }
    )
}

$track.onpointerup = () => {
    if (!navigator.geolocation) return
    if (watch_id != null) {
        localStorage.asked_track = 'no'
        stop_tracking()
        return
    }
    localStorage.asked_track = 'yes'
    start_tracking({fly: true})
}

function mark_install_success($icon_install) {
    ;[$icon_install_apk, $icon_install_ios].forEach(button => {
        button.style.color = '#888'
        button.style.cursor = 'default'
        button.style.opacity = 0.7
        button.style.pointerEvents = 'none'
        button.onpointerup = null
    })

    const check = document.createElementNS('http://www.w3.org/2000/svg', 'g')
    check.setAttribute('class', 'install-check')
    check.innerHTML = `
        <circle cx="226" cy="34" r="16" fill="#1fa75a"></circle>
        <path d="M218 34l6 6 10-12" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
    `
    const svg = $icon_install.querySelector('svg')
    svg.appendChild(check)
}

window.addEventListener('beforeinstallprompt', event_install => {
    event_install.preventDefault()
    $logo.style.cursor = 'pointer'
    $logo.style.pointerEvents = 'auto'

    $logo.onpointerup = () => {
        $icon_install_apk.toggleAttribute('hidden')
        $icon_install_ios.toggleAttribute('hidden')
    }

    $icon_install_apk.onpointerup = () => {
        event_install.prompt()
        event_install.userChoice.then(({ outcome }) => {
            if (outcome === 'accepted') mark_install_success($icon_install_apk)
        })
    }

    $icon_install_ios.onpointerup = () => {
        event_install.prompt()
        event_install.userChoice.then(({ outcome }) => {
            if (outcome == 'accepted') mark_install_success($icon_install_ios)
        })
    }
})

window.addEventListener('appinstalled', () => {
    gtag('event', 'installed')
})

$card_close.onclick = () => {
    window.card_was_open = false
    $card.setAttribute('hidden', '')
    if (y_card_min) $card.style.height = y_card_min + 'px'
}

function toggle_like(id) {
    var liked
    const likes = new Set((localStorage.getItem('likes') || '').split(',').filter(_ => !!_).map(_ => Number(_)))
    if (likes.has(id)) {
        likes.delete(id)
        liked = false
    } else {
        likes.add(id)
        liked = true
    }
    if (window.card_id == id) $card_heart.classList.toggle('like', liked)
    const likes_string = [...likes].join(',')
    localStorage.setItem('likes', likes_string)
    $likes_count.textContent = likes.size || ''
    if (current_page == PAGE.EDIT) {
        if (window.map) map.setFeatureState(
            { source: 'prices', id },
            { liked }
        )
        const url = new URL(location)
        url.searchParams.set('likes', likes_string)
        history.replaceState({}, '', url)
    }
    return likes
}

$card_heart.onclick = () => toggle_like(card_id)

var card_height = null
var y_card_max = null
var y_card_min = null
var detect_y_card_min = false

window.card_was_open = false
window.addEventListener('resize', () => {
    if (is_touch_vertical()) {
        if (card_was_open) $card.removeAttribute('hidden')
    } else {
        $card.setAttribute('hidden', '')
    }
})

window.photo_current_index = null
window.photo_total_count = null

var photo_size = null
new ResizeObserver(() => {
    $photos_container.style.transition = 'none'
    photo_size = $photo.getBoundingClientRect().width
    //to_current()
}).observe($photo)

var card_start_t = null
var card_start_x = 0
var card_start_y = 0
var card_start_small = true
var card_going_close = undefined
var card_prev_x = 0
var card_prev_prev_x = 0
var card_prev_y = 0
var card_prev_prev_y = 0
var card_end_t = null
var card_end_x = 0
var card_end_y = 0
var x_photo_min = null
var x_photo_max = null
var cur_x
var photo_swipe

$card.ontouchstart = e => {
    e.stopPropagation()
    if (e.target.id == 'contact') return
    if (e.target.id == 'card_heart') return
    if (e.target.id == 'icon-card-heart') return
    if (e.target.classList.contains('dot')) return
    if (e.target.id == 'dots') return
    $card.style.transition = 'none'
    card_start_t = Date.now()
    card_start_x = e.changedTouches[0].screenX
    card_start_y = e.changedTouches[0].screenY
    card_prev_prev_x = card_start_x
    card_prev_prev_y = card_start_y
    var rect = $card.getBoundingClientRect()
    card_height = rect.height
    if (!y_card_min || detect_y_card_min == false) {
        detect_y_card_min = true
        y_card_min = card_height
    }
    y_card_max = Math.min(rect.width, 0.75 * window.innerHeight) +
        10 // addition for mover then aspect 1:1 for photo would be correct
        // where 10px is diff between padding and top padding
    card_going_close = undefined
    
    $photos_container.style.transition = 'none'
    x_photo_min = 0
    x_photo_max = (photo_total_count - 1) * photo_size
    cur_x = photo_current_index * photo_size
    photo_swipe = undefined
}
$card.ontouchmove = e => {
    e.stopPropagation()
    if (e.target.id == 'contact') return
    if (e.target.id == 'card_heart') return
    if (e.target.id == 'icon-card-heart') return
    if (e.target.classList.contains('dot')) return
    if (e.target.id == 'dots') return
    try{ e?.preventDefault()} catch(e) {}
    card_prev_prev_x = card_prev_x
    card_prev_x = e.changedTouches[0].screenX
    card_prev_prev_y = card_prev_y
    card_prev_y = e.changedTouches[0].screenY
    
    var dx = card_prev_x - card_start_x
    var dy = card_prev_y - card_start_y

    if (photo_swipe == undefined) {
        photo_swipe = (
            e.target.id == 'photo' ||
            e.target.classList.contains('photo')
        ) && 2 * Math.abs(dx) > Math.abs(dy)
    }
    
    if (photo_swipe) {
        var x = Math.max(x_photo_min, Math.min(x_photo_max, cur_x - dx))
        $photos_container.style.transform = `translate3d(-${x}px,0,0)`
        $photos_container.removeAttribute('hidden')
    } else {
        $photos_container.setAttribute('hidden', '')
        var last_move_direction = dy > 0 ? 'down' : 'up'
        
        if (card_going_close == undefined) {
            card_going_close = card_start_small &&
                last_move_direction == 'down'
        }
        if (dy == 0) return

        var h = +$card.style.height.replace('px', '') || y_card_min
        var bottom = +$card.style.bottom.replace('px', '') || 0

        if (card_going_close) {
            var y = Math.max(0, Math.min(y_card_min, dy))
            $card.style.bottom = `-${y}px`
        } else {
            return //Disable min/mid views 
            var y = Math.max(y_card_min, Math.min(y_card_max, card_height - dy))
            $card.style.height = `${y}px`
            $card_info.setAttribute('hidden', '')
        }
    }
}
$card.ontouchend = e => {
    e.stopPropagation()
    if (e.target.id == 'contact') return
    if (e.target.id == 'card_heart') return
    if (e.target.id == 'icon-card-heart') return
    if (e.target.classList.contains('dot')) return
    if (e.target.id == 'dots') return
    card_end_t = Date.now()
    card_end_x = e.changedTouches[0].screenX
    card_end_y = e.changedTouches[0].screenY
    var dt = card_end_t - card_start_t // user moved by finger in ms
    var dx = card_end_x - card_start_x // user moved by finger by px
    var dy = card_end_y - card_start_y // user moved by finger by px
    if (photo_swipe) {
        //var vX = Math.max(0.3, 1.5 * Math.abs(dx / dt))
        $photos_container.style.transition = 'transform 0.25s ease-out'
        var frames = Math.ceil(Math.abs(dx / photo_size))
        var last_move_direction = card_end_x > card_prev_prev_x ? 'left' : 'right'
        if (last_move_direction == 'right') {
            if (dx > 0) to_current() 
            else next_proto_right(frames)
        } else {
            if (dx < 0) to_current() 
            else next_proto_left(frames)
        }
        return
    }
    var dY = null // future rest path for animation
    var dT = null // future rest time for animation
    var vY = Math.max(0.4, 1.5 * Math.abs(dy / dt))
    var h = +$card.style.height.replace('px', '') || y_card_min
    var b = +$card.style.bottom.replace('px', '') || 0
    var last_move_direction = card_end_y > card_prev_prev_y
        ? 'down'
        : 'up'

    if (card_going_close) {
        if (last_move_direction == 'down') {
            dY = y_card_min - b
            dT = Math.abs(dY / vY)
            $card.style.transition = `bottom ${(dT/1000).toFixed(2)}s linear`
            $card.style.bottom = `-${y_card_min}px`
        } else {
            dY = 0 - b
            dT = Math.abs(dY / vY)
            $card.style.transition = `bottom ${(dT/1000).toFixed(2)}s linear`
            $card.style.bottom = 0
        }
    } else {
        return //Disable min/mid views 
        if (last_move_direction == 'down') {
            card_start_small = true
            dY = y_card_min - h
            dT = Math.abs(dY / vY)
            $card.style.transition = `height ${(dT/1000).toFixed(2)}s linear`
            $card.style.height = y_card_min + 'px'
            setTimeout(() => $card_info.removeAttribute('hidden'), dT)
        } else {
            card_start_small = false
            dY = y_card_max - h
            dT = Math.abs(dY / vY)
            $card.style.transition = `height ${(dT/1000).toFixed(2)}s linear`
            $card.style.height = y_card_max + 'px'
            $card_info.setAttribute('hidden', '')
        }
    }
}

function to_current() {
    var x = photo_current_index * photo_size
    $photos_container.style.transform = `translate3d(-${x}px,0,0)`
    $photo.style.backgroundImage = $photos_container.children[photo_current_index].style.backgroundImage
}
function next_proto_right(frames) {
    if (frames == 0) return
    if (photo_current_index + frames < photo_total_count) {
        ;[...$dots.children].forEach(_ => _.classList.remove('active'))
        photo_current_index += frames
        var x = photo_current_index * photo_size
        $photos_container.style.transform = `translate3d(-${x}px,0,0)`
        $dots.children[photo_current_index].classList.add('active')
        $photo.style.backgroundImage = $photos_container.children[photo_current_index].style.backgroundImage
    } else {
       next_proto_right(frames - 1)
    }
}
function next_proto_left(frames) {
    if (frames == 0) return
    if (photo_current_index - frames >= 0) {
        ;[...$dots.children].forEach(_ => _.classList.remove('active'))
        photo_current_index -= frames
        var x = photo_current_index * photo_size
        $photos_container.style.transform = `translate3d(-${x}px,0,0)`
        $dots.children[photo_current_index].classList.add('active')
        $photo.style.backgroundImage = $photos_container.children[photo_current_index].style.backgroundImage
    } else {
        next_proto_left(frames - 1)
    }
}

$dots.onclick = e => {
    if (!e.target.classList.contains('dot')) return
    var index = [...$dots.children].findIndex(_ => _ == e.target)
    if (index == photo_current_index) return
    
    ;[...$dots.children].forEach(_ => _.classList.remove('active'))
    
    photo_current_index = index
    var x = photo_current_index * photo_size
    $photos_container.style.transform = `translate3d(-${x}px,0,0)`
    $dots.children[photo_current_index].classList.add('active')
}

$heart.onpointerup = e => {
    const url = new URL(location)
    if (url.searchParams.has('likes')) {
        url.searchParams.delete('likes')

        map.setLayoutProperty('likes-outline', 'visibility', 'none')
        map.setLayoutProperty('likes-hitbox', 'visibility', 'none')
        map.setLayoutProperty('price-circle', 'visibility', 'visible')
        map.setLayoutProperty('price-circle-filtered', 'visibility', 'visible')
        map.setLayoutProperty('price-text', 'visibility', 'visible')
        map.setLayoutProperty('price-hitbox', 'visibility', 'visible')
    } else {
        url.searchParams.set('likes', likes_local_storage.join(','))
        history.replaceState({}, '', url)
        current_page = PAGE.EDIT
        
        map.setLayoutProperty('likes-filled', 'visibility', 'visible')
        map.setLayoutProperty('likes-outline', 'visibility', 'visible')
        map.setLayoutProperty('likes-hitbox', 'visibility', 'visible')
        map.setLayoutProperty('price-circle', 'visibility', 'none')
        map.setLayoutProperty('price-circle-filtered', 'visibility', 'none')
        map.setLayoutProperty('price-text', 'visibility', 'none')
        map.setLayoutProperty('price-hitbox', 'visibility', 'none')
    }
    $share.toggleAttribute('hidden', current_page != PAGE.EDIT)
    toggler.toggleAttribute('hidden', window.current_page != PAGE.MAIN)
    filter.setAttribute('hidden', '')
    $icon_filter.removeAttribute('hidden')
    $icon_dong.setAttribute('hidden', '')
}

$share.onclick = () => {
    if (navigator.share) {
        navigator.share({
            title: 'Selected rentals',
            text: '',
            url: window.location.href
        })
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href)

const limit = {
    min: null,
    max: null
}
var range
const step$ = 0.1
const get_label = y => {
    const abs_pos = (y - limit.min) / range
    const pos$ = limit$.min + range$ * abs_pos
    return pos$.toFixed(1)
}
const get_y_by_$ = $ => {
    const abs_pos = ($ - limit$.min) / range$
    const y = limit.min + range * abs_pos
    return y
}
var rect_scale, rect_min
var min_y, max_y

function pointerdown(e) {
    const el = e.currentTarget
    el.setPointerCapture(e.pointerId)
    let y = e.clientY
    const pos = y - rect_scale.bottom + rect_min.height / 2
    const dist_min = Math.abs(min_y - pos)
    const dist_max = Math.abs(max_y - pos)
    var target = dist_min < dist_max ? min : max
    function pointermove(e) {
        const dy = e.clientY - y
        y = e.clientY

        if (target == min) {
            update_min_y(dy)
        }
        if (target == max) {
            update_max_y(dy)
        }
    }

    function pointerup(e) {
        el.releasePointerCapture(e.pointerId)
        el.removeEventListener('pointermove', pointermove)
        el.removeEventListener('pointerup', pointerup)
        el.removeEventListener('pointercancel', pointerup)
    }

    el.addEventListener('pointermove', pointermove)
    el.addEventListener('pointerup', pointerup)
    el.addEventListener('pointercancel', pointerup)
}

var steps_count
var step
var min$
var max$

toggler.onpointerup = e => {
    if (filter.hasAttribute('hidden')) {
        filter.removeAttribute('hidden')
        $icon_dong.removeAttribute('hidden')
        $icon_filter.setAttribute('hidden', '')
    } else {
        filter.setAttribute('hidden', '')
        $icon_dong.setAttribute('hidden', '')
        $icon_filter.removeAttribute('hidden')
        filter.onwheel = null
        return
    }
    rect_scale = scale.getBoundingClientRect()
    rect_min = min.getBoundingClientRect()
    limit.min = 0
    limit.max = 0 - (rect_scale.height - rect_min.height)
    range = limit.max - limit.min
    steps_count = (limit$.max - limit$.min) / step$
    step = (limit.max - limit.min) / steps_count

    min$ = +localStorage.getItem('min$')
    max$ = +localStorage.getItem('max$')

    min_y = min$ ? get_y_by_$(min$ / 1e6) : limit.min
    max_y = max$ ? get_y_by_$(max$ / 1e6) : limit.max

    min.style.transform = `translate3d(0, ${min_y}px, 0)`
    max.style.transform = `translate3d(0, ${max_y}px, 0)`
    $min_label.textContent = get_label(min_y)
    $max_label.textContent = get_label(max_y)
    min$ = $min_label.textContent * 1e6,
    max$ = $max_label.textContent * 1e6,
    apply_filter()

    filter.addEventListener('pointerdown', pointerdown)

    toggler.onwheel = onwheel
    filter.onwheel = onwheel

    function onwheel(e) {
        e.preventDefault()
        const DOWN = e.deltaY > 0
        const UP   = e.deltaY < 0
        if (!e.deltaY) return
        const dy = DOWN ? -step : step
        const pos = e.clientY - rect_scale.bottom + rect_min.height / 2
        const dist_min = Math.abs(min_y - pos)
        const dist_max = Math.abs(max_y - pos)
        var target = null
        if (dist_min < dist_max) {
            if (DOWN) {
                if (min_y == limit.min) {
                    target = null
                    // swith target max
                    if (max_y == min_y - rect_min.height) {
                        target = null // max near min
                    } else {
                        target = max
                    }
                } else {
                    target = min
                }
            }
            if (UP) {
                if (min_y == max_y + rect_min.height) {
                    target = null
                    /*
                    // switch target max
                    if (max_y == limit.max) {
                        target = null // max & min at top border
                    } else {
                        target = max
                    }
                    */
                } else {
                    target = min
                }
            }
        } else {
            if (DOWN) {
                if (max_y == min_y - rect_min.height) {
                    target = null
                    /*
                    // swith target min
                    if (min_y == limit.min) {
                        target = null // max & min at lower border
                    } else {
                        target = min
                    }
                    */
                } else {
                    target = max
                }
            }
            if (UP) {
                if (max_y == limit.max) {
                    target = null
                    //target min
                    if (min_y == max_y + rect_min.height) {
                        target = null // max & min at top border
                    } else {
                        target = min
                    }
                } else {
                    target = max
                }
            }
        }
        if (target == min) {
            update_min_y(dy)
        } else if (target == max) {
            update_max_y(dy)
        }
    }
}

update_min_y = dy => {
    min_y += dy
    if (min_y > limit.min) min_y = limit.min
    if (min_y - rect_min.height < max_y) min_y = max_y + rect_min.height
    min.style.transform = `translate3d(0, ${min_y}px, 0)`
    $min_label.textContent = get_label(min_y)
    min$ = $min_label.textContent * 1e6,
    localStorage.setItem('min$', min$)
    apply_filter()
}

update_max_y = dy => {
    max_y += dy
    if (max_y < limit.max) max_y = limit.max
    if (max_y + rect_min.height > min_y) max_y = min_y - rect_min.height
    max.style.transform = `translate3d(0, ${max_y}px, 0)`
    $max_label.textContent = get_label(max_y)
    max$ = $max_label.textContent * 1e6
    localStorage.setItem('max$', max$)
    apply_filter()
}

function throttle(func, wait, options) {
  var timeout, context, args, result;
  var previous = 0;
  if (!options) options = {};

  var later = function() {
    previous = options.leading === false ? 0 : Date.now();
    timeout = null;
    result = func.apply(context, args);
    if (!timeout) context = args = null;
  };

  var throttled = function() {
    var _now = Date.now();
    if (!previous && options.leading === false) previous = _now;
    var remaining = wait - (_now - previous);
    context = this;
    args = arguments;
    if (remaining <= 0 || remaining > wait) {
      if (timeout) {
        clearTimeout(timeout);
        timeout = null;
      }
      previous = _now;
      result = func.apply(context, args);
      if (!timeout) context = args = null;
    } else if (!timeout && options.trailing !== false) {
      timeout = setTimeout(later, remaining);
    }
    return result;
  };

  throttled.cancel = function() {
    clearTimeout(timeout);
    previous = 0;
    timeout = context = args = null;
  };

  return throttled;
}

ago = t => {
    var dt = Date.now() - t
    var s = Math.round(dt / 1000)
    if (s < 1) return 'now'
    if (s == 1) return s + ' second'
    if (s < 60) return s + ' seconds'
    var m = Math.round(s / 60)
    if (m == 1) return m + ' minute'
    if (m < 60) return m + ' minutes'
    var h = Math.round(m / 60)
    if (h == 1) return h + ' hour'
    if (h < 24) return h + ' hours'
    var d = Math.round(h / 24)
    if (d == 1) return d + ' day'
    if (d < 7) return d + ' days'
    var w = Math.round(d / 7)
    if (w == 1) return w + ' week'
    if (w < 4) return w + ' weeks'
    var M = Math.round(d / 30)
    if (M == 1) return M + ' month'
    if (M < 12) return M + ' months'
    var Y = Math.round(d / 365)
    if (Y == 1) return Y + ' year'
    return Y + ' years'
}

                            return ad.price <= max$ && ad.price >= min$
                        })
                            ? 'hidden'
                            : 'filtered'
                        : 'filtered'
                    : 'normal'
            }
        )
    )
}

                                'hidden', 0,
                                [
                                    'case',
                                    ['boolean', ['feature-state', 'hover'], false],
                                    1,
                                    0.8
                                ]//normal
                            ],
                            16, [
                                'match',
                                ['feature-state', 'mode'],
                                'selected', 1,
                                'other', 0,
                                'filtered', 0,
                                'hidden', 0,
                                [
                                    'case',
                                    ['boolean', ['feature-state', 'hover'], false],
                                    1,
                                    0.9
                                ]//normal
                            ]
                        ]
                    }
                },
                {
                    id: 'price-text',
                    type: 'symbol',
                    source: 'prices',
                    minzoom: 13,
                    layout: {
                        'visibility': 'none',
                        'text-field': ['get', 'price_label'],
                        'text-size': font_size,
                        'text-font': ['Noto Sans Bold'],
                        'text-anchor': 'top',
                        'text-offset': [0, 0.5],
                        'symbol-sort-key': ['get', 'price']
                    },
                    paint: {
                        'text-color': theme.paint['price-text']['text-color'][+!dark]
                    }
                },
                {
                    id: 'price-text-shared-likes',
                    type: 'symbol',
                    source: 'prices',
                    minzoom: 13,
                    layout: {
                        'visibility': 'none',
                        'text-field': ['get', 'price_label'],
                        'text-size': font_size,
                        'text-font': ['Noto Sans Bold'],
                        'text-anchor': 'top',
                        'text-offset': [0, 0.6],
                        //'text-allow-overlap': true,
                        'text-ignore-placement': true
                    },
                    paint: {
                        'text-color': theme.paint['price-text-shared-likes']['text-color'][+!dark],
                        'text-opacity': [
                            'case',
                            ['boolean', ['feature-state', 'liked'], false],
                            1,
                            0
                        ]
                    }
                },
                {
                    id: 'price-hitbox',
                    type: 'circle',
                    source: 'prices',
                    layout: {
                        'visibility': 'none'
                    },
                    paint: {
                        'circle-radius': 30,
                        'circle-opacity': 0// DEBUG 0.2,
                        //'circle-color': '#124f92',
                    }
                },
                {
                    id: 'likes-outline',
                    type: 'symbol',
                    source: 'prices',
                    layout: {
                        'visibility': 'none',
                        'icon-image': 'heart-outline',
                        'icon-size': 0.25,
                        'icon-allow-overlap': true,
                        'icon-ignore-placement': true
                    },
                    paint: {
                        'icon-opacity': [
                            'case',
                            ['boolean', ['feature-state', 'liked'], false],
                            0,
                            1
                        ],
                        'icon-color': [
                            'case',
                            ['boolean', ['feature-state', 'hover'], false],
                            '#E5E8DB',
                            '#888'
                        ]
                    }
                },
                {
                    id: 'likes-filled',
                    type: 'symbol',
                    source: 'prices',
                    layout: {
                        'visibility': 'none',
                        'icon-image': 'heart-filled',
                        'icon-size': 0.25,
                        'icon-allow-overlap': true,
                        'icon-ignore-placement': true
                    },
                    paint: {
                        'icon-opacity': [
                            'case',
                            ['boolean', ['feature-state', 'liked'], false],
                            1,
                            0
                        ],
                        'icon-color': '#E5E8DB',//hot-pink
                    }
                },
                {
                    id: 'likes-hitbox',
                    type: 'circle',
                    source: 'prices',
                    layout: {
                        'visibility': 'none'
                    },
                    paint: {
                        'circle-radius': 30,
                        'circle-opacity': 0
                    }
                }
            ].sort((a, b) => layers_order(a.id, b.id))
        }

        const map_args = {
            container: 'map',
            style,
            maxBounds: new maplibregl.LngLatBounds(
                [raw_danang_bounds[0], raw_danang_bounds[1]],
                [raw_danang_bounds[2], raw_danang_bounds[3]]
            ),
            attributionControl: false
        }
        if (likes_search_params.length) {
            const likes_bounds = get_likes_bounds()
            map_args.bounds = [
                [likes_bounds[0], likes_bounds[1]],
                [likes_bounds[2], likes_bounds[3]]
            ]
            map_args.fitBoundsOptions = {padding: 100}
        } else {
            map_args.center = window.current_page && current_page == PAGE.SINGLE
                ? [ad_current.longitude, ad_current.latitude]
                : get_center()
            map_args.zoom = window.current_page && current_page == PAGE.SINGLE ? 15 : get_zoom()
        }

        window.map = new maplibregl.Map(map_args)

        map.dragRotate.disable()
        map.touchZoomRotate.disableRotation()

        map.addImage('heart-filled', heart_filled, {sdf: true})
        map.addImage('heart-outline', heart_outline, {sdf: true})

        map.on('style.load', () => {
            if (
                initial_inner_size[0] != window.innerWidth ||
                initial_inner_size[1] != window.innerHeight
            ) map.resize()

            var hovered_price_id = null
            var hovered_likes_id = null

            map.on('mousemove', 'price-hitbox', e => {
                const click_priority = {normal: 1, filtered: 0}
                e.features.sort((a, b) =>
                    click_priority[b.state.mode] - click_priority[a.state.mode]
                )
                const id = e.features[0].id
                if (id == hovered_price_id) return
                if (hovered_price_id != null) {
                    map.setFeatureState(
                        { source: 'prices', id: hovered_price_id },
                        { hover: false }
                    )
                }

                hovered_price_id = id

                map.setFeatureState(
                    { source: 'prices', id: hovered_price_id },
                    { hover: true }
                )

                map.getCanvas().style.cursor = 'pointer'
            })
            map.on('mouseleave', 'price-hitbox', e => {
                const $ = document.elementFromPoint(e.point.x, e.point.y)
                if ($?.closest('#card')) return

                if (hovered_price_id != null) {
                    map.setFeatureState(
                        { source: 'prices', id: hovered_price_id },
                        { hover: false }
                    )
                }

                hovered_price_id = null
                map.getCanvas().style.cursor = ''
            })
            map.on('mousemove', 'likes-hitbox', e => {
                var id
                if (current_page == PAGE.SHARED) {
                    var hovered_feature = e.features.find(_ => likes_search_params.includes(_.id))
                    if (hovered_feature) {
                        id = hovered_feature.id
                    } else {
                        return
                    }
                } else {
                    var id = (
                        e.features.find(_ => _.state.liked) ||
                        e.features[0]
                    ).id
                }

                if (hovered_likes_id != null && id != hovered_likes_id) {
                    map.setFeatureState(
                        { source: 'prices', id: hovered_likes_id },
                        { hover: false }
                    )
                }

                hovered_likes_id = id

                map.setFeatureState(
                    { source: 'prices', id: hovered_likes_id },
                    { hover: true }
                )

                map.getCanvas().style.cursor = 'pointer'
            })
            map.on('mouseleave', 'likes-hitbox', e => {
                if (hovered_likes_id != null) {
                    map.setFeatureState(
                        { source: 'prices', id: hovered_likes_id },
                        { hover: false }
                    )
                }

                hovered_likes_id = null
                map.getCanvas().style.cursor = ''
            })

            map.on('click', 'likes-hitbox', e => {
                var id = (
                    e.features.find(_ => _.state.liked) ||
                    e.features[0]
                ).id
                if (current_page == PAGE.SHARED) {
                    var hovered_feature = e.features.find(_ => likes_search_params.includes(_.id))
                    if (hovered_feature) {
                        id = hovered_feature.id
                    } else {
                        return
                    }
                    const url = get_url(id)
                    console.log('https://durian.rent/id/' + id)
                    gtag('event', 'ad_click', {ad_id: id, ad_url: url, price: hovered_feature.properties.price, page: current_page})
                    window.open(url, '_blank')
                    return
                }
                var likes = toggle_like(id)
            })
            map.on('click', 'price-hitbox', e => {
                const click_priority = {normal: 1, filtered: 0}
                e.features.sort((a, b) =>
                    click_priority[b.state.mode] - click_priority[a.state.mode]
                )
                const id = e.features[0].id
                const price = e.features[0].properties.price
                const url = get_url(id)
                if (!is_touch_vertical()) {
                    gtag('event', 'ad_click', {ad_id: id, ad_url: url, price, page: current_page})
                    window.open(url, '_blank')
                    return
                }

                window.card_id = id
                const ad = ads.find(ad => ad.id == id)
                $card.removeAttribute('hidden')
                window.card_was_open = true
                $card.style.bottom = 0
                if (y_card_min) $card.style.height = y_card_min + 'px'
                $card_info.removeAttribute('hidden')
                const likes = new Set((localStorage.getItem('likes') || '').split(',').filter(_ => !!_).map(_ => Number(_)))
                $card_heart.classList.toggle('like', likes.has(id))

                var photos_urls
                try {
                    photos_urls = get_ad_img_urls(id)
                    if ('serviceWorker' in navigator) navigator.serviceWorker.controller?.postMessage({type: 'PHOTO_PRIORITY', url: photos_urls[0]})
                } catch (e) {
                    console.error(`ERROR: get_ad_img_urls(${id}) ${url}`, e)
                    photos_urls = []
                }
                $dots.innerHTML = ''
                photo_total_count = photos_urls.length
                photo_current_index = 0
                $photos_container.style.transform = `translate3d(0,0,0)`
                $photo.style.backgroundImage = `url("${photos_urls[i]}")`
                for (var i = 0, $; i < photos_urls.length; i++) {
                    if ($photos_container.children[i]) {
                        $ = $photos_container.children[i]
                        $.style.backgroundImage = `url("${photos_urls[i]}")`
                    } else {
                        $ = document.createElement('div')
                        $.className = 'photo'
                        $.style.backgroundImage = `url("${photos_urls[i]}")`
                        $photos_container.appendChild($)
                    }
                    var $dot = document.createElement('div')
                    $dot.className = 'dot'
                    $dots.appendChild($dot)
                    if (i == 0) {
                        $dot.classList.add('active')
                        $photo.style.backgroundImage = `url("${photos_urls[i]}")`
                    }
                }
                while ($photos_container.children.length > photos_urls.length) {
                    $photos_container.lastElementChild.remove()
                }
                var price_string = String(price).split('').reverse()
                var price_string_space = ''
                for (var i = 0; i < price_string.length; i++) {
                    if (i != 0 && i % 3 == 0)
                        price_string_space = ' ' + price_string_space
                    price_string_space = price_string[i] + price_string_space
                }
                $price.textContent = price_string_space
                $category.textContent = get_category_for_user(ad.category)
                $area.textContent = get_area_v2_for_user(ad.area)
                $m2.textContent = ad.m2
                $publish.textContent = `${ago(ad.publish)}`
                $contact.onclick = () => gtag('event', 'ad_click', {ad_id: id, ad_url: url, price, page: current_page})
                $contact.href = url
                
                fetch(
                    '/ads.bin',
                    {headers: {'Range': `bytes=${get_ad_range(id).join('-')}`}}
                )
                .then(_ => _.arrayBuffer())
                .then(ab => {
                    const view = new DataView(ab)
                    const decoder = new TextDecoder('utf-8')
                    var offset = 0
                    
                    const subjectLen = view.getUint32(offset, false)
                    offset += 4
                    const subject = decoder.decode(new Uint8Array(ab, offset, subjectLen))
                    offset += subjectLen
                    
                    const bodyLen = view.getUint32(offset, false)
                    offset += 4
                    const body = decoder.decode(new Uint8Array(ab, offset, bodyLen))
                    offset += bodyLen
                    
                    const streetLen = view.getUint32(offset, false)
                    offset += 4
                    const street_name = decoder.decode(new Uint8Array(ab, offset, streetLen))
                    return [subject, body, street_name]
                })
                .then(([subject, body, street_name]) => {
                    $street.textContent = street_name
                    console.log(
                        'subject:', subject,
                        'body:', body,
                        'street_name:', street_name
                    )
                })
            })
            map.on('click', e => {
                features = map.queryRenderedFeatures(e.point, {
                    layers: ['price-hitbox']
                })
                if (!features || !features.length) {
                    $card.setAttribute('hidden', '')
                    if (y_card_min) $card.style.height = y_card_min + 'px'
                    if (current_page == PAGE.SINGLE) {
                        current_page = PAGE.MAIN
                        history.pushState({}, '', '/')
                        router()
                    }
                    return
                }
            })

            navigator.geolocation && navigator.permissions?.query({ name: 'geolocation' })
            .then(geo_permission => {
                window.geo_permission = geo_permission
                if (geo_permission.state == 'granted' && localStorage.asked_track == 'yes') {
                    start_tracking({fly: false, auto_start: true})
                } else {
                    $track.removeAttribute('hidden')
                }
                geo_permission.onchange = () => {
                    if (geo_permission.state == 'granted' && localStorage.asked_track == 'yes') {
                        start_tracking({fly: true})
                    }
                    if (geo_permission.state == 'denied') {
                        stop_tracking()
                    }
                }
            })

            var time_values = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(new Date(+VER_WASM)).map(_ => [_.type, _.value]))
            $last_update_time_value.textContent =
                `${time_values.year}-${time_values.month}-${time_values.day} ${time_values.hour}:${time_values.minute}`

            router()
        })

        map.once('load', () => {
            if (cache_pmtiles_exist_and_loading == null) {
                fetch('/danang.pmtiles', {cache: 'no-store', priority: 'low'})
                .then(_ => {
                    if (_.ok && _.status == 200) {
                        caches.open('pmtiles')
                        .then(c => c.put('/danang.pmtiles', _.clone()))
                        .then(() =>
                            cache_pmtiles_exist_and_loading = _.arrayBuffer()
                            .then(_ => new Uint8Array(_))
                        )
                    }
                })
            }

            const GA = 'https://www.googletagmanager.com/gtag/js?id=G-RJ21952T38'
            caches.open('ga')
            .then(c =>
                c.match(GA)
                .then(r =>
                    r || fetch(GA, {priority: 'low'})
                    .then(r =>
                        r.ok && c.put(GA, r.clone()).then(_ => r)
                    )
                )
            )
            .then(r => r.text())
            .then(code => {
                const script = document.createElement('script')
                script.textContent = code
                document.head.appendChild(script)

                window.dataLayer = window.dataLayer || []
                window.gtag = function gtag(){dataLayer.push(arguments)}
                gtag('js', new Date())
                gtag('config', 'G-RJ21952T38')
            })
            
            const URL_ADS_PRICES = `/price.list?v=${VER_WASM}`
            caches.open('price.list')
            .then(cache =>
                cache.keys()
                .then(keys => keys[0])
                .then(r =>
                    r?.url.endsWith(`?v=${VER_WASM}`)
                        ? cache.match(r)
                        : Promise.resolve(r && cache.delete(r))
                        .then(() => fetch(URL_ADS_PRICES))
                        .then(response => {
                            cache.put(URL_ADS_PRICES, response.clone())
                            return response
                        })
                )
                .then(r => r.text())
                .then(set_ads_prices)
            )
        })

    })
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js?v=15')
</script>
</body>
</html>
